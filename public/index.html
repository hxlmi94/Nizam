      if(x.durum==='ÖDENDİ') bakiye += x.yon*x.tutar;
      return `<tr><td>${x.tarih||'—'}</td><td>${esc(x.tur)}</td><td>${esc(x.aciklama)}</td><td>${esc(x.durum||'')}</td><td class="mono">${tl(x.tutar)}</td><td class="mono">${tl(bakiye)}</td></tr>`;
    }).join('');
    result.innerHTML = `
      <div id="printArea">
        <h3 style="margin-bottom:2px;">${esc(proje?.ad||'')} — Kişi Bazlı Cari Hesap</h3>
        <p style="color:var(--ink-dim);font-size:12.5px;margin:0 0 14px;">${esc(kisi)} — Oluşturulma tarihi: ${new Date().toLocaleDateString('tr-TR')}</p>
        <div class="divider" style="margin:0 0 18px;"></div>
        <div class="stat-grid" style="margin-bottom:16px;">
          <div class="stat-card"><div class="label">Bu Kişiden Alınan</div><div class="value small">${tl(gelirToplam)}</div></div>
          <div class="stat-card"><div class="label">Bu Kişiye Ödenen</div><div class="value small">${tl(giderToplam)}</div></div>
          <div class="stat-card"><div class="label">Net Bakiye</div><div class="value small" style="color:${(gelirToplam-giderToplam)>=0?'var(--success)':'var(--danger)'};">${tl(gelirToplam-giderToplam)}</div></div>
        </div>
        <p style="font-size:11px;color:var(--ink-dim);margin:0 0 10px;">Net bakiye pozitifse bu kişiden projeye net para girişi, negatifse projeden bu kişiye net ödeme var demektir.</p>
        <table class="plain"><thead><tr><th>Tarih</th><th>Tür</th><th>Açıklama</th><th>Durum</th><th>Tutar</th><th>Bakiye</th></tr></thead><tbody>
          ${satirlar || '<tr><td colspan="6">Kayıt yok</td></tr>'}
        </tbody></table>
      </div>
      <button class="btn btn-primary btn-block no-print" id="p_ekstre_print2" style="margin-top:16px;">${ICON.printer} Yazdır / PDF Kaydet</button>
    `;
    document.getElementById('p_ekstre_print2').onclick = ()=> window.print();
  };
}

/* ---------------------------- PROJE YEVMİYE / GÜNDELİK İŞÇİLİK ---------------------------- */
// Yevmiyeli (günlük ücretli) şantiye işçileri için hızlı kayıt ekranı. Personel sekmesi sabit
// aylık maaşlılar içindir; yevmiyeliler her gün farklı kişi/tutar olabileceği için bunun yerine
// arka planda normal bir Gider satırı (sabit bir gider türüyle işaretli) olarak kaydedilir —
// böylece hem Giderler listesinde hem projenin Cari Hesabında otomatik görünürler.
const YEVMIYE_GIDER_TURU = 'Yevmiye (Gündelik İşçilik)';
function bugununTarihi(){
  const d = new Date();
  const p = n => String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
}
function openProjeYevmiyeSheet(pid){
  const proje = STATE.projeler.find(p=>p.id===pid);
  const {expenses} = kayitlarForProje(pid);
  const kayitlar = expenses.filter(e=>e.gider_turu===YEVMIYE_GIDER_TURU).sort((a,b)=>(b.tarih||'').localeCompare(a.tarih||''));
  const isimler = [...new Set(kayitlar.map(k=>k.taraf).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'tr'));
  const ozet = {};
  kayitlar.forEach(k=>{
    const isim = k.taraf || 'İsimsiz';
    if(!ozet[isim]) ozet[isim] = {gun:0, toplam:0};
    ozet[isim].gun++;
    if(k.durum==='ÖDENDİ') ozet[isim].toplam += Number(k.tutar)||0;
  });
  const ozetSatirlari = Object.entries(ozet).sort((a,b)=>a[0].localeCompare(b[0],'tr'));
  const html = `
    <div class="sheet-head">
      <button class="close" id="yevmiyeBack">${ICON.chevronLeft}</button>
      <h2 style="flex:1;">Yevmiye / Gündelik İşçilik</h2>
      <button class="close" data-close-sheet>${ICON.x}</button>
    </div>
    <p style="color:var(--ink-dim);font-size:12.5px;margin-top:-8px;">${esc(proje?.ad||'')} — her ödemeyi tek tek ekle, alttan kişi bazlı toplamı gör. Sabit maaşlı çalışanlar için bunun yerine Personel sekmesini kullan.</p>
    <div class="field"><label>İşçi Adı</label><input id="yv_isim" list="yv_isim_list" placeholder="örn. Mehmet Usta" /></div>
    <datalist id="yv_isim_list">${isimler.map(i=>`<option value="${esc(i)}"></option>`).join('')}</datalist>
    <div style="display:flex;gap:10px;">
      <div class="field" style="flex:1;"><label>Tarih</label><input id="yv_tarih" type="date" value="${bugununTarihi()}" /></div>
      <div class="field" style="flex:1;"><label>Günlük Ücret (₺)</label><input id="yv_tutar" type="text" inputmode="decimal" /></div>
    </div>
    <div class="field"><label>Durum</label>
      <div class="seg" data-role="yvDurumSeg">
        <button type="button" data-d="ÖDENDİ" class="on odendi">Ödendi</button>
        <button type="button" data-d="ÖDENMEDİ">Ödenmedi</button>
      </div>
    </div>
    <button class="btn btn-primary btn-block" id="yv_ekle_btn" style="margin-bottom:18px;">${ICON.plus} Ekle</button>

    ${ozetSatirlari.length ? `
    <div class="section-title">Kişi Bazlı Özet</div>
    <div class="table-card" style="margin-bottom:14px;">
      <div class="table-scroll"><table class="table-pro">
        <thead><tr><th>İsim</th><th class="num">Gün</th><th class="num">Ödenen Toplam</th></tr></thead>
        <tbody>${ozetSatirlari.map(([isim,o])=>`<tr><td class="name-cell">${esc(isim)}</td><td class="num">${o.gun}</td><td class="num">${tl(o.toplam)}</td></tr>`).join('')}</tbody>
      </table></div>
    </div>` : ''}

    <div class="section-title">Tüm Kayıtlar</div>
    ${!kayitlar.length ? `<p style="color:var(--ink-dim);font-size:13px;">Henüz kayıt yok.</p>` : `
    <div class="table-card">
      <div class="table-scroll"><table class="table-pro">
        <thead><tr><th>Tarih</th><th>İsim</th><th class="num">Tutar</th><th>Durum</th><th></th></tr></thead>
        <tbody>${kayitlar.map(k=>`<tr>
          <td>${k.tarih? new Date(k.tarih).toLocaleDateString('tr-TR'):'—'}</td>
          <td class="name-cell">${esc(k.taraf||'—')}</td>
          <td class="num">${tl(k.tutar)}</td>
          <td>${k.durum==='ÖDENDİ'?'<span class="chip odendi">Ödendi</span>':'<span class="chip odenmedi">Ödenmedi</span>'}</td>
          <td><button type="button" class="btn btn-danger" data-yv-sil="${k.id}" style="padding:6px 10px;">${ICON.x}</button></td>
        </tr>`).join('')}</tbody>
      </table></div>
    </div>`}
  `;
  openSheet(html);
  document.getElementById('yevmiyeBack').onclick = ()=> closeSheet();
  let durum = 'ÖDENDİ';
  const durumSeg = document.querySelector('[data-role="yvDurumSeg"]');
  durumSeg.querySelectorAll('[data-d]').forEach(b=>{
    b.onclick = ()=>{
      durumSeg.querySelectorAll('[data-d]').forEach(x=>x.className='');
      durum = b.dataset.d;
      b.className = 'on ' + (durum==='ÖDENDİ'?'odendi':'odenmedi');
    };
  });
  document.getElementById('yv_ekle_btn').onclick = async ()=>{
    const isim = document.getElementById('yv_isim').value.trim();
    const tarih = document.getElementById('yv_tarih').value || null;
    const tutar = parseTLInput(document.getElementById('yv_tutar').value);
    if(!isim){ showToast('İşçi adı gerekli'); return; }
    if(!tutar){ showToast('Günlük ücret gerekli'); return; }
    const payload = {
      isletme_id: STATE.currentIsletmeId,
      gider_turu: YEVMIYE_GIDER_TURU,
      taraf: isim,
      tutar,
      tarih,
      durum,
      kategori: 'sabit',
      proje_id: pid,
    };
    const btn = document.getElementById('yv_ekle_btn');
    btn.disabled = true;
    try{
      const data = await api('/api/expenses', {method:'POST', body:payload});
      STATE.expenses.unshift(data);
      showToast('Eklendi');
      openProjeYevmiyeSheet(pid);
    }catch(err){ showToast('Eklenemedi: '+err.message); }
    finally{ btn.disabled=false; }
  };
  document.querySelectorAll('[data-yv-sil]').forEach(btn=>{
    btn.onclick = async ()=>{
      const id = Number(btn.dataset.yvSil);
      try{
        await api('/api/expenses/'+id, {method:'DELETE'});
        STATE.expenses = STATE.expenses.filter(x=>x.id!==id);
        showToast('Silindi');
        openProjeYevmiyeSheet(pid);
      }catch(err){ showToast('Silinemedi: '+err.message); }
    };
  });
}

/* ---------------------------- ÖN MUHASEBE: ödeme şekli, KDV, kasa/banka, taksitler ---------------------------- */
const ODEME_SEKLI_SECENEKLERI = ['Nakit', 'Banka Havalesi/EFT', 'Kredi Kartı', 'Çek', 'Diğer'];
const KDV_ORANI_SECENEKLERI = [0, 1, 10, 20];
function odemeSekliSelectHtml(secili, idPrefix){
  const bos = `<option value="">— Belirtilmedi —</option>`;
  return bos + ODEME_SEKLI_SECENEKLERI.map(o=>`<option value="${esc(o)}" ${o===secili?'selected':''}>${esc(o)}</option>`).join('');
}
function kdvOraniSelectHtml(secili){
  const bos = `<option value="">KDV'siz / Belirtilmedi</option>`;
  return bos + KDV_ORANI_SECENEKLERI.map(o=>`<option value="${o}" ${String(o)===String(secili)?'selected':''}>%${o}</option>`).join('');
}
// Tutar KDV DAHİL (brüt) kabul edilir; orana göre içindeki KDV tutarını ayrıştırır.
function hesaplaKdvTutari(tutarBrut, oran){
  const t = Number(tutarBrut)||0;
  const o = Number(oran)||0;
  if(!t || !o) return 0;
  return Math.round((t - t/(1+o/100)) * 100) / 100;
}
// Kasa (nakit) ve Banka (havale/kredi kartı/çek) bazında, ÖDENDİ işaretli tüm gelir/gider
// hareketlerinden bugüne kadarki net durumu hesaplar — bir ön muhasebecinin ilk bakacağı şey.
function kasaBankaOzeti(){
  const gruplar = {Nakit:0, Banka:0, Çek:0, Belirtilmedi:0};
  function grupAdi(sekli){
    if(sekli==='Nakit') return 'Nakit';
    if(sekli==='Banka Havalesi/EFT' || sekli==='Kredi Kartı') return 'Banka';
    if(sekli==='Çek') return 'Çek';
    return 'Belirtilmedi';
  }
  STATE.gelirler.filter(g=>g.durum==='ÖDENDİ').forEach(g=>{ gruplar[grupAdi(g.odeme_sekli)] += (Number(g.tutar)||0); });
  STATE.expenses.filter(e=>e.durum==='ÖDENDİ').forEach(e=>{ gruplar[grupAdi(e.odeme_sekli)] -= (Number(e.tutar)||0); });
  return gruplar;
}
// Bir kontrata ait taksit planı, vade tarihine göre sıralı.
function taksitlerForKontrat(kontratId){
  return STATE.contractInstallments.filter(t=>t.kontrat_id===kontratId).sort((a,b)=>(a.taksit_no||0)-(b.taksit_no||0));
}
// Bir taksite bağlı otomatik gelir/gider satırı (varsa) — durum/tarih bilgisini oradan okuruz.
function kayitForTaksit(taksitId, gelirYonlu){
  const liste = gelirYonlu ? STATE.gelirler : STATE.expenses;
  return liste.find(x=>x.taksit_id===taksitId) || null;
}

// Gider "Sabit Gider" mi "Extra Harcama" mı? Kayıtlı bir değer varsa onu kullan,
// yoksa (yeni kayıt) gider türü metnine göre tahmin et — sunucudaki mantıkla aynı.
function guessExpenseKategoriClient(giderTuru, kategori){
  if(kategori==='sabit' || kategori==='extra') return kategori;
  const t = (giderTuru||'').toLocaleLowerCase('tr-TR');
  if(t.includes('kırtasiye') || t.includes('kirtasiye') || t.includes('mutfak') || t.includes('temizlik')) return 'extra';
  return 'sabit';
}

async function openExpenseBelge(id){
  try{
    const res = await fetch('/api/expenses/'+id+'/belge', {headers: authToken() ? {'Authorization':'Bearer '+authToken()} : {}});
    if(!res.ok) throw new Error('Belge alınamadı');
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    window.open(url, '_blank');
  }catch(err){ showToast('Belge açılamadı: '+err.message); }
}

    showToast('Kaydettiğinde belge kaldırılacak');
    document.getElementById('f_belge_row').style.opacity = '0.4';
  };

  document.getElementById('saveExpBtn').onclick = async ()=>{
    const fileInput = document.getElementById('f_belge_input');
    const file = fileInput.files[0];
    if(file && file.size > 8*1024*1024){ showToast('Dosya çok büyük (en fazla 8 MB)'); return; }
    let firma = kilitli ? currentFirma : (firmaSelect.value==='__yeni__' ? (firmaYeni.value||null) : (firmaSelect.value||null));
    let bakim_id = null;
    if(bakimSelect.value==='__yeni__'){
      const ad = document.getElementById('f_bakim_ad').value;
      const siklik = document.getElementById('f_bakim_siklik').value;
      if(ad){
        try{
          const mi = await api('/api/maintenance', {method:'POST', body:{isletme_id:STATE.currentIsletmeId, ad, siklik}});
          STATE.maintenanceItems.push(mi);
          bakim_id = mi.id;

      }
    }else if(bakimSelect.value){

    const fTutarVal = parseTLInput(document.getElementById('f_tutar').value);

function computeGelirGider(){
  const site = isSiteTipi();
  const aidatRows = site ? STATE.payments.filter(p=>p.tur==='aidat') : [];
  const aidatToplam = aidatRows.reduce((s,p)=>s+(Number(p.tutar_odenen)||0),0);
  const demirbasRows = site ? STATE.payments.filter(p=>p.tur==='demirbas') : [];
  const demirbasToplam = demirbasRows.reduce((s,p)=>s+(Number(p.tutar_odenen)||0),0);
  const gelirlerToplam = site ? 0 : STATE.gelirler.filter(g=>g.durum==='ÖDENDİ').reduce((s,g)=>s+(Number(g.tutar)||0),0);
  const gelirToplam = aidatToplam + demirbasToplam + gelirlerToplam;

  const aidatByMonth = STATE.months.map(m=>({
    donem: m,
    tutar: aidatRows.filter(p=>p.donem===m).reduce((s,p)=>s+(Number(p.tutar_odenen)||0),0),
  }));

  const giderRows = STATE.expenses.filter(e=>e.durum==='ÖDENDİ');
  const giderToplam = giderRows.reduce((s,e)=>s+(Number(e.tutar)||0),0);
  const giderByTur = {};
  giderRows.forEach(e=>{ const k=e.gider_turu||'Diğer'; giderByTur[k]=(giderByTur[k]||0)+(Number(e.tutar)||0); });

  const personelOdemeToplam = STATE.staffPayments.filter(sp=>sp.durum==='ÖDENDİ').reduce((s,sp)=>{
    const st = STATE.staff.find(x=>x.id===sp.staff_id);
    return s + (st ? Number(st.aylik_ucret)||0 : 0);
  },0);

  const giderGenelToplam = giderToplam + personelOdemeToplam;
  const net = gelirToplam - giderGenelToplam;

  // Aylık gelir trendi (grafik için) — site'de aidat, genel'de tarihli gelir kayıtları
  let gelirTrend;
  if(site){
    gelirTrend = aidatByMonth.map(r=>({key:r.donem, label:monthLabel(r.donem), short:(MONTH_NAMES[r.donem.slice(5,7)]||'').slice(0,3), tutar:r.tutar}));
  }else{
    const byMonth = {};
    STATE.gelirler.filter(g=>g.durum==='ÖDENDİ' && g.tarih).forEach(g=>{
      const key = g.tarih.slice(0,7);
      byMonth[key] = (byMonth[key]||0) + (Number(g.tutar)||0);
    });
    gelirTrend = Object.keys(byMonth).sort().map(key=>({key, label:monthLabel(key), short:(MONTH_NAMES[key.slice(5,7)]||'').slice(0,3), tutar:byMonth[key]}));
  }

  return {aidatToplam, demirbasToplam, gelirlerToplam, gelirToplam, aidatByMonth, giderToplam, giderByTur, personelOdemeToplam, giderGenelToplam, net, gelirTrend};
}

/* ---------------------------- BAĞIMSIZ SVG GRAFİKLER ---------------------------- */
function svgBarChart(rows, opts){
  opts = opts||{};
  const w = opts.width||320, h = opts.height||150, padL=6, padR=6, padT=10, padB=22;
  const innerW = w-padL-padR, innerH = h-padT-padB;
  if(!rows.length) return `<p style="font-size:12.5px;color:var(--ink-dim);">Grafik için yeterli veri yok.</p>`;
  const max = Math.max(...rows.map(r=>r.tutar), 1);
  const bw = innerW/rows.length;
  const bars = rows.map((r,i)=>{
    const bh = max>0 ? (r.tutar/max)*innerH : 0;
    const x = padL + i*bw + bw*0.18;
    const y = padT + (innerH-bh);
    const bw2 = bw*0.64;
    const lbl = r.short || (r.label||'').split(' ')[0].slice(0,3);
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw2.toFixed(1)}" height="${bh.toFixed(1)}" rx="2.5" fill="${r.color||'var(--brand)'}"></rect>
      <text x="${(x+bw2/2).toFixed(1)}" y="${h-7}" text-anchor="middle" font-size="8.5" fill="var(--ink-dim)" font-family="var(--font-body)">${esc(lbl)}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px;overflow:visible;">
    <line x1="${padL}" y1="${padT+innerH}" x2="${w-padR}" y2="${padT+innerH}" stroke="var(--line)" stroke-width="1"></line>
    ${bars}
  </svg>`;
}

function svgDonutChart(entries){
  // entries: [{label, value}]
  const w=140, h=140, cx=70, cy=70, r=52, stroke=20;
  const total = entries.reduce((s,e)=>s+e.value,0);
  if(!total) return `<p style="font-size:12.5px;color:var(--ink-dim);">Grafik için yeterli veri yok.</p>`;
  const palette = ['var(--brand)','var(--gold)','var(--success)','var(--warning)','var(--danger)','var(--ink-dim)'];
  let acc = 0;
  const circumf = 2*Math.PI*r;
  const segs = entries.map((e,i)=>{
    const frac = e.value/total;
    const dash = frac*circumf;
    const gap = circumf-dash;
    const offset = -acc*circumf;
    acc += frac;
    return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${palette[i%palette.length]}" stroke-width="${stroke}"
      stroke-dasharray="${dash.toFixed(1)} ${gap.toFixed(1)}" stroke-dashoffset="${offset.toFixed(1)}" transform="rotate(-90 ${cx} ${cy})"></circle>`;
  }).join('');
  const legend = entries.map((e,i)=>`
    <div style="display:flex;align-items:center;gap:6px;font-size:11.5px;margin-bottom:5px;">
      <span style="width:9px;height:9px;border-radius:2px;background:${palette[i%palette.length]};flex:none;"></span>
      <span style="flex:1;color:var(--ink-dim);">${esc(e.label)}</span>
      <span class="mono" style="font-weight:600;">${tl(e.value)}</span>
    </div>`).join('');
  return `<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap;">
    <svg viewBox="0 0 ${w} ${h}" style="width:130px;height:130px;flex:none;">${segs}</svg>
    <div style="flex:1;min-width:140px;">${legend}</div>
  </div>`;
}

// KDV Özeti: mali müşavirin KDV beyannamesi hazırlarken ihtiyaç duyacağı özet —
// ay bazında tahsil edilen (satış) KDV, ödenen (alış) KDV, tevkifat ve net durum.
function openKdvOzetiReport(){
  const isletmeAdi = currentIsletme()?.ad || '';
  const aylar = {};
  function ekle(ay, alan, tutar){
    if(!aylar[ay]) aylar[ay] = {hesaplananGelirKdv:0, hesaplananGiderKdv:0, tevkifat:0};
    aylar[ay][alan] += (Number(tutar)||0);
  }
  STATE.gelirler.filter(g=>g.durum==='ÖDENDİ' && g.kdv_orani).forEach(g=>{
    const ay = g.tarih ? g.tarih.slice(0,7) : '__belirsiz__';
    ekle(ay, 'hesaplananGelirKdv', g.kdv_tutari || hesaplaKdvTutari(g.tutar, g.kdv_orani));
  });
  STATE.expenses.filter(e=>e.durum==='ÖDENDİ' && (e.kdv_orani || e.kdv_tevkifat_tutar)).forEach(e=>{
    const ay = e.tarih ? e.tarih.slice(0,7) : '__belirsiz__';
    if(e.kdv_orani) ekle(ay, 'hesaplananGiderKdv', e.kdv_tutari || hesaplaKdvTutari(e.tutar, e.kdv_orani));
    if(e.kdv_tevkifat_tutar) ekle(ay, 'tevkifat', e.kdv_tevkifat_tutar);
  });
  const aylarSirali = Object.keys(aylar).sort((a,b)=>b.localeCompare(a));
  const genelToplam = aylarSirali.reduce((acc,ay)=>{
    acc.hesaplananGelirKdv += aylar[ay].hesaplananGelirKdv;
    acc.hesaplananGiderKdv += aylar[ay].hesaplananGiderKdv;
    acc.tevkifat += aylar[ay].tevkifat;
    return acc;
  }, {hesaplananGelirKdv:0, hesaplananGiderKdv:0, tevkifat:0});
  const netKdv = genelToplam.hesaplananGelirKdv - genelToplam.hesaplananGiderKdv - genelToplam.tevkifat;
  const html = `
    <div class="sheet-head">
      <button class="close" id="backToHub">${ICON.chevronLeft}</button>
      <h2 style="flex:1;">KDV Özeti</h2>
      ${reportBackClose()}
    </div>
    <div id="printArea">
      <h3 style="margin-bottom:2px;">${esc(isletmeAdi)} — KDV Özeti</h3>
      <p style="color:var(--ink-dim);font-size:12.5px;margin:0 0 14px;">Oluşturulma tarihi: ${new Date().toLocaleDateString('tr-TR')} — sadece KDV oranı/tevkifatı girilmiş, "ödendi/alındı" işaretli kayıtları kapsar.</p>
      <div class="divider" style="margin:0 0 18px;"></div>
      <div class="stat-grid" style="margin-bottom:18px;">
        <div class="stat-card"><div class="label">Hesaplanan Satış KDV'si</div><div class="value small">${tl(genelToplam.hesaplananGelirKdv)}</div></div>
        <div class="stat-card"><div class="label">Hesaplanan Alış KDV'si</div><div class="value small">${tl(genelToplam.hesaplananGiderKdv)}</div></div>
        <div class="stat-card"><div class="label">KDV Tevkifatı</div><div class="value small">${tl(genelToplam.tevkifat)}</div></div>
        <div class="stat-card"><div class="label">Net KDV (Ödenecek/Devreden)</div><div class="value small" style="color:${netKdv>=0?'var(--danger)':'var(--success)'};">${tl(Math.abs(netKdv))}${netKdv>=0?' (ödenecek)':' (devreden)'}</div></div>
      </div>
      <div class="section-title">Ay Bazında Dökum</div>
      <table class="plain"><thead><tr><th>Ay</th><th>Satış KDV</th><th>Alış KDV</th><th>Tevkifat</th><th>Net</th></tr></thead><tbody>
        ${aylarSirali.map(ay=>{
          const a = aylar[ay];
          const net = a.hesaplananGelirKdv - a.hesaplananGiderKdv - a.tevkifat;
          return `<tr><td>${ay==='__belirsiz__'?'Tarihsiz':monthLabel(ay)}</td><td class="mono">${tl(a.hesaplananGelirKdv)}</td><td class="mono">${tl(a.hesaplananGiderKdv)}</td><td class="mono">${tl(a.tevkifat)}</td><td class="mono">${tl(net)}</td></tr>`;
        }).join('') || '<tr><td colspan="5">KDV bilgisi girilmiş kayıt yok</td></tr>'}
      </tbody></table>
      <p style="color:var(--ink-dim);font-size:11px;margin-top:16px;line-height:1.5;">Bu özet genel bilgilendirme amaçlıdır, resmi KDV beyannamesi yerine geçmez. Kesin hesaplama için mali müşavirinize danışın.</p>
    </div>
    <button class="btn btn-primary btn-block no-print" id="kdvPrintBtn" style="margin-top:16px;">${ICON.printer} Yazdır / PDF Kaydet</button>
  `;
  openSheet(html);
  document.getElementById('backToHub').onclick = openReportsHub;
  document.getElementById('kdvPrintBtn').onclick = ()=> window.print();
}

function exportGelirGiderExcel(d){
  if(typeof XLSX==='undefined'){ showToast('Excel modülü yüklenemedi, internet bağlantınızı kontrol edin'); return; }
  const site = isSiteTipi();
  const isletmeAdi = currentIsletme()?.ad || 'İşletme';
  const wb = XLSX.utils.book_new();
  const ozet = [
    [isletmeAdi+' — Gelir-Gider Tablosu'],
    ['Oluşturulma tarihi', new Date().toLocaleDateString('tr-TR')],
    [],
    ['Toplam Gelir', d.gelirToplam],
    ['Toplam Gider', d.giderGenelToplam],
    ['Net Durum', d.net],
    ...(site ? [['Aidat Toplam', d.aidatToplam], ['Demirbaş Toplam', d.demirbasToplam]] : [['Gelir Kayıtları Toplamı', d.gelirlerToplam]]),
  ];
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(ozet), 'Özet');

  if(site){
    const aylik = [['Ay','Tahsilat'], ...d.aidatByMonth.map(r=>[monthLabel(r.donem), r.tutar])];
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aylik), 'Aylık Aidat');
  } else {
    const gelirSheet = [['Açıklama','Tutar','Tarih'], ...STATE.gelirler.filter(g=>g.durum==='ÖDENDİ').map(g=>[g.aciklama||'', g.tutar, g.tarih||''])];
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(gelirSheet), 'Gelirler');
  }

  const giderler = [['Gider Türü','Tutar'], ...Object.entries(d.giderByTur), ['Personel Maaşları (ödenen)', d.personelOdemeToplam]];
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(giderler), 'Giderler');

  XLSX.writeFile(wb, (isletmeAdi.replace(/[^a-zA-Z0-9ığüşöçİĞÜŞÖÇ]+/g,'-'))+'-gelir-gider-'+todayISO()+'.xlsx');
}

/* ---------------------------- YILLIK KARŞILAŞTIRMA ---------------------------- */
function computeYillikKarsilastirma(){
  const site = isSiteTipi();
  const now = new Date();
  const thisYear = String(now.getFullYear());
  const lastYear = String(now.getFullYear()-1);

  const gelirByYear = {};
  let gelirYilBilinmiyor = 0;
  if(site){
    STATE.payments.filter(p=>p.tur==='aidat' && p.tutar_odenen).forEach(p=>{
      const y = p.donem ? p.donem.slice(0,4) : null;
      if(!y) return;
      gelirByYear[y] = (gelirByYear[y]||0) + (Number(p.tutar_odenen)||0);
    });
  } else {
    STATE.gelirler.filter(g=>g.durum==='ÖDENDİ').forEach(g=>{
      if(!g.tarih){ gelirYilBilinmiyor += Number(g.tutar)||0; return; }
      const y = g.tarih.slice(0,4);
      gelirByYear[y] = (gelirByYear[y]||0) + (Number(g.tutar)||0);
    });
  }

  const giderByYear = {};
  let giderYilBilinmiyor = 0;
  STATE.expenses.filter(e=>e.durum==='ÖDENDİ').forEach(e=>{
    if(!e.tarih){ giderYilBilinmiyor += Number(e.tutar)||0; return; }
    const y = e.tarih.slice(0,4);
    giderByYear[y] = (giderByYear[y]||0) + (Number(e.tutar)||0);
  });

  const personelByYear = {};
  STATE.staffPayments.filter(sp=>sp.durum==='ÖDENDİ').forEach(sp=>{
    const y = sp.ay ? sp.ay.slice(0,4) : null;
    if(!y) return;
    const st = STATE.staff.find(x=>x.id===sp.staff_id);
    personelByYear[y] = (personelByYear[y]||0) + (st ? Number(st.aylik_ucret)||0 : 0);
  });

  function rowFor(y){
    const gelir = gelirByYear[y]||0;
    const gider = (giderByYear[y]||0) + (personelByYear[y]||0);
    return {year:y, gelir, gider, net: gelir-gider};
  }
  function pctChange(a,b){ if(!b) return a>0 ? null : 0; return ((a-b)/b)*100; }
  const cur = rowFor(thisYear), prev = rowFor(lastYear);
  return {thisYear, lastYear, cur, prev, giderYilBilinmiyor, gelirYilBilinmiyor,
    gelirChange: pctChange(cur.gelir, prev.gelir),
    giderChange: pctChange(cur.gider, prev.gider)};
}

function pctBadge(pct, goodDirection){
  // goodDirection: 'up' (artış iyi, ör. gelir) veya 'down' (artış kötü, ör. gider)
  if(pct===null) return `<span class="chip" style="background:var(--neutral-chip);color:var(--ink-dim);">yeni</span>`;
  const up = pct>=0;
  const iyi = goodDirection==='up' ? up : !up;
  const color = iyi ? 'var(--success)' : 'var(--danger)';
  return `<span class="mono" style="font-weight:700;color:${color};">${up?'+':''}${pct.toFixed(1)}%</span>`;
}

        <p style="color:var(--ink-dim);font-size:12.5px;margin:0 0 14px;">${esc(kisi)} — Oluşturulma tarihi: ${new Date().toLocaleDateString('tr-TR')}</p>
        <div class="divider" style="margin:0 0 18px;"></div>
        <div class="stat-grid" style="margin-bottom:16px;">
          <div class="stat-card"><div class="label">Bu Kişiden Alınan</div><div class="value small">${tl(gelirToplam)}</div></div>
          <div class="stat-card"><div class="label">Bu Kişiye Ödenen</div><div class="value small">${tl(giderToplam)}</div></div>
          <div class="stat-card"><div class="label">Net Bakiye</div><div class="value small" style="color:${(gelirToplam-giderToplam)>=0?'var(--success)':'var(--danger)'};">${tl(gelirToplam-giderToplam)}</div></div>
        </div>
        <p style="font-size:11px;color:var(--ink-dim);margin:0 0 10px;">Net bakiye pozitifse bu kişiden şirkete net para girişi, negatifse şirketten bu kişiye net ödeme var demektir.</p>
        <table class="plain"><thead><tr><th>Tarih</th><th>Tür</th><th>Açıklama</th><th>Durum</th><th>Tutar</th><th>Bakiye</th></tr></thead><tbody>
          ${satirlar || '<tr><td colspan="6">Kayıt yok</td></tr>'}
        </tbody></table>
      </div>
      <button class="btn btn-primary btn-block no-print" id="ekstre_print2" style="margin-top:16px;">${ICON.printer} Yazdır / PDF Kaydet</button>
    `;
    document.getElementById('ekstre_print2').onclick = ()=> window.print();
  };
}

function openIsletmeProjesiSheet(){
  const staffToplam = STATE.staff.reduce((s,p)=>s+(Number(p.aylik_ucret)||0),0);
  const alanToplam = STATE.apartments.reduce((s,a)=>s+(Number(a.toplam_brut_alan)||0),0);
  const html = `
    <div class="sheet-head">
      <button class="close" id="backToHub">${ICON.chevronLeft}</button>
      <h2 style="flex:1;">İşletme Projesi Hesaplayıcı</h2>
      ${reportBackClose()}
    </div>
    <p style="color:var(--ink-dim);font-size:12.5px;margin-top:-8px;">Kat Mülkiyeti Kanunu'na göre; personel gibi ortak hizmet giderleri dairelere eşit, diğer giderler ise dairenin alanı oranında dağıtılır. Tutarları girip hesaplayın.</p>

    <div class="field"><label>Aylık Personel Gideri (eşit dağıtılır)</label><input type="text" inputmode="decimal" id="ip_personel" value="${staffToplam||''}" /></div>
    <div class="field"><label>Aylık Diğer Sabit Giderler (elektrik, su, asansör bakımı, sigorta vb. — alan oranında dağıtılır)</label><input type="text" inputmode="decimal" id="ip_diger" placeholder="0" /></div>
    <div class="field" style="margin-bottom:6px;"><label>Yedek Akçe Oranı (%)</label><input type="number" inputmode="decimal" id="ip_yedek" value="10" /></div>
    <p style="color:var(--ink-dim);font-size:11px;margin:0 0 14px;">Not: Yedek akçe genellikle yıllık gider toplamının %10'unu aşmayacak şekilde belirlenir. Kesin oran için mali müşavirinize danışın.</p>
    <button class="btn btn-gold btn-block" id="ip_hesapla">Hesapla</button>
    <div id="ip_result"></div>
  `;
  openSheet(html);
  document.getElementById('backToHub').onclick = openReportsHub;
  document.getElementById('ip_hesapla').onclick = ()=>{
    const personel = parseTLInput(document.getElementById('ip_personel').value)||0;
    const diger = parseTLInput(document.getElementById('ip_diger').value)||0;
    const yedekOran = Number(document.getElementById('ip_yedek').value)||0;
    const araToplam = personel + diger;
    const yedek = araToplam * (yedekOran/100);
    const genelToplam = araToplam + yedek;
    const esitPay = STATE.apartments.length ? personel/STATE.apartments.length : 0;

    const rows = STATE.apartments.map(a=>{
      const alanOrani = alanToplam ? (Number(a.toplam_brut_alan)||0)/alanToplam : 0;
      const oranliPay = (diger+yedek) * alanOrani;
      return {no:a.no, malik:a.malik, toplam: esitPay + oranliPay};
    });
    const toplamAidat = rows.reduce((s,r)=>s+r.toplam,0);

    document.getElementById('ip_result').innerHTML = `
      <div id="printArea">
        <div class="divider"></div>
        <h3 style="margin-bottom:2px;">${esc(currentIsletme()?.ad||'')} — İşletme Projesi</h3>
        <p style="color:var(--ink-dim);font-size:12.5px;margin:0 0 16px;">Oluşturulma tarihi: ${new Date().toLocaleDateString('tr-TR')}</p>
        <div class="stat-grid" style="margin-bottom:16px;">
          <div class="stat-card"><div class="label">Aylık Toplam Gider</div><div class="value small">${tl(genelToplam)}</div></div>
          <div class="stat-card"><div class="label">Yedek Akçe</div><div class="value small">${tl(yedek)}</div></div>
        </div>
        <div class="section-title">Daire Bazında Aylık Aidat</div>
        <table class="plain"><thead><tr><th>Daire</th><th>Malik</th><th>Aidat</th></tr></thead><tbody>
          ${rows.map(r=>`<tr><td>${r.no}</td><td>${esc(r.malik||'')}</td><td class="mono">${tl(r.toplam)}</td></tr>`).join('')}
          <tr><td colspan="2"><b>Toplam</b></td><td class="mono"><b>${tl(toplamAidat)}</b></td></tr>
        </tbody></table>
      </div>
      <button class="btn btn-primary btn-block no-print" id="ip_print" style="margin-top:16px;">${ICON.printer} Yazdır / PDF Kaydet</button>
    `;
    document.getElementById('ip_print').onclick = ()=> window.print();
  };
}

function openGenelKurulReport(){
  const d = computeGelirGider();
  const unpaid = STATE.currentMonth ? STATE.apartments.filter(a=>{
    const p = paymentFor(a.no,'aidat',STATE.currentMonth);
    return !p || p.durum!=='ÖDENDİ';
  }) : [];
  const notlar = STATE.settings.genel_kurul_notu || '';
  const html = `
    <div class="sheet-head">
      <button class="close" id="backToHub">${ICON.chevronLeft}</button>
      <h2 style="flex:1;">Genel Kurul Özet Raporu</h2>
      ${reportBackClose()}
    </div>
    <div id="printArea">
      <h3 style="margin-bottom:2px;">${esc(currentIsletme()?.ad||'')} — Genel Kurul Özet Raporu</h3>
      <p style="color:var(--ink-dim);font-size:12.5px;margin:0 0 14px;">Oluşturulma tarihi: ${new Date().toLocaleDateString('tr-TR')}</p>
      <div class="divider" style="margin:0 0 18px;"></div>

      <div class="stat-grid" style="margin-bottom:16px;">
        <div class="stat-card"><div class="label">Toplam Gelir</div><div class="value small">${tl(d.gelirToplam)}</div></div>
        <div class="stat-card"><div class="label">Toplam Gider</div><div class="value small">${tl(d.giderGenelToplam)}</div></div>
        <div class="stat-card"><div class="label">Net Durum</div><div class="value small">${tl(d.net)}</div></div>
        <div class="stat-card"><div class="label">Personel Sayısı</div><div class="value small">${STATE.staff.length}</div></div>
      </div>

      <div class="section-title">${STATE.currentMonth?monthLabel(STATE.currentMonth):'Bu ay'} İtibarıyla Ödemeyen Daireler (${unpaid.length})</div>
      ${unpaid.length ? `<table class="plain"><thead><tr><th>Daire</th><th>Malik</th></tr></thead><tbody>
        ${unpaid.map(a=>`<tr><td>${a.no}</td><td>${esc(a.malik||'')}</td></tr>`).join('')}
      </tbody></table>` : '<p style="font-size:13px;color:var(--ink-dim);">Tüm daireler güncel.</p>'}

      <div class="section-title">Personel Özeti</div>
      <table class="plain"><thead><tr><th>İsim</th><th>Görev</th><th>Aylık Ücret</th></tr></thead><tbody>
        ${STATE.staff.map(p=>`<tr><td>${esc(p.isim||'—')}</td><td>${esc(p.gorev)}</td><td class="mono">${tl(p.aylik_ucret)}</td></tr>`).join('') || '<tr><td colspan="3">Kayıt yok</td></tr>'}
      </tbody></table>

      <div class="section-title">Notlar</div>
      <p id="notlarPrint" style="white-space:pre-wrap;font-size:13.5px;">${esc(notlar)||'—'}</p>
    </div>

    <div class="field no-print" style="margin-top:16px;">
      <label>Genel kurulda paylaşmak istediğiniz ek notlar</label>
      <textarea id="gk_notlar" placeholder="örn. asansör bakımı için teklif alındı...">${esc(notlar)}</textarea>
    </div>
    <button class="btn btn-ghost btn-block no-print" id="gk_save_note" style="margin-bottom:10px;">Notu Kaydet</button>
    <button class="btn btn-primary btn-block no-print" id="gk_print">${ICON.printer} Yazdır / PDF Kaydet</button>
  `;
  openSheet(html);
  document.getElementById('backToHub').onclick = openReportsHub;
  document.getElementById('gk_save_note').onclick = async ()=>{
    const v = document.getElementById('gk_notlar').value;
    await saveSetting('genel_kurul_notu', v);
    document.getElementById('notlarPrint').textContent = v || '—';
    showToast('Not kaydedildi');
  };
  document.getElementById('gk_print').onclick = ()=> window.print();
}

const YASAL_ITEMS = [
  {key:'karar_defteri', title:'Karar Defteri', desc:"Kat malikleri kurulunun aldığı tüm kararların yazıldığı, noter onaylı ve sayfaları numaralı defter. Her yıl sonunda (31 Aralık'a kadar) noterde kapanış tasdiki yaptırılmalı."},
  {key:'gelir_gider_defteri', title:'Gelir-Gider Defteri', desc:'Tüm aidat tahsilatları ve giderlerin işlendiği, noter onaylı defter. Fatura ve makbuzların saklanması gerekir.'},
  {key:'isletme_projesi', title:'İşletme Projesi', desc:"Yıllık tahmini gelir-gider ve her dairenin payını gösteren, kat maliklerine tebliğ edilmesi gereken belge (Kat Mülkiyeti Kanunu md. 37). Bu bölümdeki hesaplayıcıyı kullanarak oluşturabilirsiniz."},
  {key:'genel_kurul_tutanagi', title:'Genel Kurul Toplantı Tutanağı', desc:'Yıllık olağan toplantıda alınan kararların, katılımcı imzalarıyla birlikte karar defterine işlenmiş hali.'},
];

function openYasalBelgelerSheet(){
  const html = `
    <div class="sheet-head">
      <button class="close" id="backToHub">${ICON.chevronLeft}</button>
      <h2 style="flex:1;">Yasal Belgeler</h2>
      ${reportBackClose()}
    </div>
    <p style="color:var(--ink-dim);font-size:12.5px;margin-top:-8px;">Kat Mülkiyeti Kanunu'na göre bir site/apartman yönetiminin tutması gereken temel belgeler aşağıdadır. Elinizde olanları işaretleyin.</p>
    <div class="row-list">
      ${YASAL_ITEMS.map(it=>{
        const checked = !!STATE.settings['yasal_'+it.key];
        return `
        <div class="card" style="padding:14px;">
          <div style="display:flex;align-items:flex-start;gap:10px;">
            <button type="button" class="yasal-check ${checked?'checked':''}" data-key="${it.key}">${checked?ICON.checkCircle:''}</button>
            <div>
              <b style="font-size:14px;">${it.title}</b>
              <p style="margin:4px 0 0;font-size:12.5px;color:var(--ink-dim);line-height:1.5;">${it.desc}</p>
            </div>
          </div>
        </div>`;
      }).join('')}
    </div>
    <p style="color:var(--ink-dim);font-size:11px;margin-top:16px;line-height:1.5;">Bu bilgiler genel bilgilendirme amaçlıdır, hukuki tavsiye niteliği taşımaz. Kesin ve güncel yükümlülükleriniz için bir mali müşavir veya avukata danışmanızı öneririz.</p>
  `;
  openSheet(html);
  document.getElementById('backToHub').onclick = openReportsHub;
  document.querySelectorAll('.yasal-check').forEach(btn=>{
    btn.onclick = async ()=>{
      const key = 'yasal_'+btn.dataset.key;
      const newVal = !STATE.settings[key];
      await saveSetting(key, newVal);
      openYasalBelgelerSheet();
    };
  });
}
