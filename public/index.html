<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Nizam</title>
<meta name="theme-color" content="#132A47" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2218%22 fill=%22%23132A47%22/><text x=%2250%22 y=%2266%22 font-size=%2256%22 text-anchor=%22middle%22 fill=%22%23C6A25C%22 font-family=%22Georgia,serif%22>N</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="manifest" href="/manifest.json">

<meta name="apple-mobile-web-app-title" content="Nizam">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* ============================= TOKENS ============================= */
:root{
  --paper:#EEF1F5;
  --surface:#FFFFFF;
  --surface-2:#E6EAF0;
  --ink:#161F2B;
  --ink-dim:#5B6B7D;
  --line:#D3DAE3;
  --brand:#132A47;
  --brand-2:#1F3D63;
  --brand-ink:#F1F5F9;
  --brand-soft:#E1E8F0;
  --gold:#AD8A48;
  --gold-line:#C6A25C;
  --gold-soft:#F4ECD8;
  --success:#227A55;
  --success-soft:#DCEFE4;
  --warning:#B5791F;
  --warning-soft:#FAEBD3;
  --danger:#B23B2E;
  --danger-soft:#F7E0DB;
  --neutral-chip:#E3E7EC;
  --shadow: 0 1px 2px rgba(15,25,38,.07), 0 8px 22px -12px rgba(15,25,38,.20);
  --radius-s:7px;
  --radius-m:11px;
  --radius-l:15px;
  --font-display:'Fraunces', Georgia, serif;
  --font-body:'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono:'IBM Plex Mono', ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F141C;
    --surface:#161E29;
    --surface-2:#1C2632;
    --ink:#E7ECF2;
    --ink-dim:#93A3B4;
    --line:#2B3644;
    --brand:#7FA0C9;
    --brand-2:#9CB6D6;
    --brand-ink:#0A0F16;
    --brand-soft:#1D2A3A;
    --gold:#D3AE72;
    --gold-line:#E0BE86;
    --gold-soft:#2E2717;
    --success:#5FBE93;
    --success-soft:#17322A;
    --warning:#E0A94E;
    --warning-soft:#33270F;
    --danger:#E08A7A;
    --danger-soft:#34211C;
    --neutral-chip:#28323E;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --paper:#0F141C;
  --surface:#161E29;
  --surface-2:#1C2632;
  --ink:#E7ECF2;
  --ink-dim:#93A3B4;
  --line:#2B3644;
  --brand:#7FA0C9;
  --brand-2:#9CB6D6;
  --brand-ink:#0A0F16;
  --brand-soft:#1D2A3A;
  --gold:#D3AE72;
  --gold-line:#E0BE86;
  --gold-soft:#2E2717;
  --success:#5FBE93;
  --success-soft:#17322A;
  --warning:#E0A94E;
  --warning-soft:#33270F;
  --danger:#E08A7A;
  --danger-soft:#34211C;
  --neutral-chip:#28323E;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
}

*{box-sizing:border-box;}
svg{width:20px;height:20px;flex-shrink:0;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  min-height:100dvh;
  overflow-x:hidden;
}
h1,h2,h3{font-family:var(--font-display);font-weight:600;letter-spacing:-.01em;text-wrap:balance;margin:0;}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
button{font-family:inherit;}
::selection{background:var(--gold-soft);}
a{color:inherit;}

/* ============================= LAYOUT (bilgisayar sistemi görünümü) ============================= */
#app{min-height:100dvh;position:relative;}
.shell{display:grid;grid-template-columns:222px 1fr;min-height:100dvh;}
.hide{display:none !important;}

.sidebar{
  background:linear-gradient(180deg, var(--brand-2), var(--brand) 70%);color:var(--brand-ink);
  padding:18px 14px;display:flex;flex-direction:column;
  position:sticky;top:0;height:100dvh;overflow-y:auto;
}
.sidebar-brand{display:flex;align-items:center;gap:9px;padding:4px 6px 18px;border-bottom:1px solid rgba(255,255,255,.14);margin-bottom:14px;}
.sidebar-brand .mark{
  width:30px;height:30px;border-radius:8px;border:1px solid var(--gold-line);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-weight:700;color:var(--gold-line);font-size:15px;flex:none;
}
.sidebar-brand .name{font-family:var(--font-display);font-weight:700;font-size:16px;}
.isletme-pill{
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:9px;
  padding:9px 10px;font-size:11px;color:rgba(241,245,249,.72);margin-bottom:16px;
  display:flex;justify-content:space-between;align-items:center;gap:6px;
  cursor:pointer;text-align:left;width:100%;font-family:inherit;
}
.isletme-pill b{color:var(--brand-ink);font-size:12.5px;display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.isletme-pill svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.2;flex:none;opacity:.7;}
.month-pill{
  display:flex;align-items:center;gap:6px;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);color:var(--brand-ink);
  border-radius:9px;padding:8px 10px;font-size:12px;font-weight:600;margin-bottom:16px;
}
.month-pill select{background:transparent;border:none;color:inherit;font:inherit;font-weight:700;-webkit-appearance:none;appearance:none;width:100%;}
.month-pill select option{color:#111;}
.month-pill svg{width:14px;height:14px;stroke:var(--brand-ink);fill:none;stroke-width:1.8;opacity:.85;flex:none;}

.sidebar nav{display:flex;flex-direction:column;gap:2px;}
.sidebar nav button{
  color:rgba(241,245,249,.72);text-decoration:none;font-size:12.5px;font-weight:600;
  padding:9px 10px;border-radius:7px;display:flex;align-items:center;gap:9px;letter-spacing:.01em;
  background:none;border:none;cursor:pointer;font-family:inherit;text-align:left;width:100%;
}
.sidebar nav button svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;opacity:.85;flex:none;}
.sidebar nav button.active{background:rgba(255,255,255,.1);color:#fff;box-shadow:inset 2px 0 0 var(--gold-line);}
.sidebar nav button.active svg{opacity:1;}
.sidebar-foot{margin-top:auto;padding-top:14px;border-top:1px solid rgba(255,255,255,.14);font-size:11px;color:rgba(241,245,249,.55);}
.sidebar-foot button{margin-top:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);color:var(--brand-ink);border-radius:7px;padding:6px 9px;font-size:11px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;font-family:inherit;}
.sidebar-foot button svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8;}

main{padding:22px 26px 60px;max-width:1280px;}

.page-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap;}
.page-head h1{font-family:var(--font-display);font-size:20px;font-weight:600;}
.page-head .sub{color:var(--ink-dim);font-size:12px;margin-top:2px;}
.page-head .actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.btn-toolbar{
  display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);
  color:var(--ink);border-radius:7px;padding:8px 14px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;
}
.btn-toolbar.gold{background:var(--brand);color:var(--gold-soft);border-color:var(--brand);}
.btn-toolbar svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.3;}

/* Responsive: dar ekranda (telefon) kenar çubuğu üstte yatay bir şeride dönüşür */
@media (max-width:899px){
  .shell{grid-template-columns:1fr;}
  .sidebar{position:sticky;top:0;height:auto;flex-direction:row;flex-wrap:nowrap;align-items:center;overflow-x:auto;overflow-anchor:none;padding:10px 12px;z-index:20;}
  .sidebar-brand{flex:none;border-bottom:none;margin-bottom:0;padding:0 12px 0 0;border-right:1px solid rgba(255,255,255,.14);}
  .isletme-pill{flex:none;width:auto;margin-bottom:0;margin-left:10px;}
  .month-pill{flex:none;margin-bottom:0;margin-left:10px;}
  .sidebar nav{flex:none;flex-direction:row;margin-left:10px;}
  .sidebar nav button{flex:none;width:auto;white-space:nowrap;}
  .sidebar-foot{flex:none;margin-top:0;margin-left:auto;padding-top:0;border-top:none;display:flex;align-items:center;}
  .sidebar-foot button{flex:none;margin-top:0;margin-left:10px;}
  main{padding:16px 16px 40px;}
}

/* ============================= COMPONENTS ============================= */
.section-title{
  font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-dim);
  font-weight:700;margin:22px 2px 10px;
  display:flex;align-items:center;gap:8px;
}
.section-title::before{content:'';width:14px;height:2px;background:var(--gold-line);flex:none;}
.section-title:first-child{margin-top:2px;}

.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);
  box-shadow:var(--shadow);
}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.stat-card{
  background:var(--surface);border:1px solid var(--line);border-top:2.5px solid var(--gold-line);
  border-radius:var(--radius-m);
  padding:13px 15px 14px;box-shadow:var(--shadow);
}
.stat-card .label{font-size:11.5px;color:var(--ink-dim);font-weight:700;text-transform:uppercase;letter-spacing:.04em;}
.stat-card .value{font-family:var(--font-display);font-size:24px;font-weight:600;margin-top:6px;letter-spacing:-.01em;}
.stat-card .value.small{font-size:19px;}
.stat-card .sub{font-size:12px;color:var(--ink-dim);margin-top:3px;}

.alert-card{
  display:flex;gap:11px;align-items:flex-start;
  background:var(--warning-soft);border:1px solid color-mix(in srgb, var(--warning) 35%, transparent);
  border-radius:var(--radius-m);padding:13px 14px;margin-bottom:9px;
}
.alert-card .dot{width:8px;height:8px;border-radius:50%;background:var(--warning);margin-top:6px;flex:none;}
.alert-card svg{width:18px;height:18px;flex:none;margin-top:1px;stroke:var(--warning);fill:none;stroke-width:1.7;}
.alert-card b{font-weight:700;}
.alert-card p{margin:2px 0 0;font-size:12.5px;color:var(--ink-dim);}

.row-list{display:flex;flex-direction:column;gap:8px;}
.apt-row{
  display:flex;align-items:center;gap:12px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);
  padding:11px 13px;box-shadow:var(--shadow);cursor:pointer;
  transition:transform .12s ease;
}
.apt-row:active{transform:scale(.985);}
.apt-no{
  width:38px;height:38px;border-radius:11px;background:var(--surface-2);
  display:flex;align-items:center;justify-content:center;flex:none;
  font-family:var(--font-mono);font-weight:600;font-size:14px;color:var(--ink);
}
.apt-info{flex:1;min-width:0;}
.apt-info .name{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.apt-info .kat{font-size:11.5px;color:var(--ink-dim);margin-top:1px;}
.apt-amount{font-family:var(--font-mono);font-size:13px;font-weight:600;color:var(--ink-dim);white-space:nowrap;}

.chip{
  display:inline-flex;align-items:center;gap:5px;
  padding:5px 10px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap;
}
.chip.odendi{background:var(--success-soft);color:var(--success);}
.chip.odenmedi{background:var(--neutral-chip);color:var(--ink-dim);}
.chip.kismi{background:var(--warning-soft);color:var(--warning);}
.chip.kontrol{background:var(--warning-soft);color:var(--warning);}
.chip.vermiyor{background:var(--danger-soft);color:var(--danger);}

.searchbar{
  display:flex;align-items:center;gap:9px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--radius-m);padding:10px 13px;margin-bottom:14px;
  box-shadow:var(--shadow);
}
.searchbar svg{width:17px;height:17px;stroke:var(--ink-dim);fill:none;stroke-width:2;flex:none;}
.searchbar input{border:none;background:none;outline:none;font:inherit;font-size:14.5px;color:var(--ink);width:100%;}
.searchbar input::placeholder{color:var(--ink-dim);}


.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:11px 16px;border-radius:12px;border:1px solid transparent;
  font-weight:700;font-size:14px;cursor:pointer;font-family:var(--font-body);
}
.btn-primary{background:var(--brand);color:var(--brand-ink);}
.btn-gold{background:var(--gold);color:#1C2733;}
.btn-ghost{background:var(--surface-2);color:var(--ink);}
.btn-danger{background:var(--danger-soft);color:var(--danger);}
.btn-block{width:100%;}
.btn:disabled{opacity:.5;}

.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-dim);margin-bottom:6px;}
.field input, .field select, .field textarea{
  width:100%;border:1px solid var(--line);background:var(--surface-2);
  border-radius:11px;padding:11px 12px;font:inherit;font-size:14.5px;color:var(--ink);outline:none;
}
.field input:focus, .field select:focus, .field textarea:focus{border-color:var(--brand);}
.field textarea{resize:vertical;min-height:60px;}
.seg{display:flex;gap:7px;flex-wrap:wrap;}
.seg button{
  flex:1;min-width:calc(50% - 4px);padding:10px 8px;border-radius:11px;border:1px solid var(--line);
  background:var(--surface-2);color:var(--ink-dim);font-weight:700;font-size:12.5px;cursor:pointer;
}
.seg button.on{border-color:transparent;box-shadow:inset 0 0 0 1.5px currentColor;}
.seg button.on.odendi{background:var(--success-soft);color:var(--success);}
.seg button.on.odenmedi{background:var(--ink);color:var(--paper);box-shadow:none;}
.seg button.on.kismi{background:var(--warning-soft);color:var(--warning);}
.seg button.on.vermiyor{background:var(--danger-soft);color:var(--danger);}

/* sheet / modal */
.overlay{
  position:fixed;inset:0;background:rgba(15,20,17,.5);z-index:50;
  display:flex;align-items:flex-end;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .18s ease;
}
.overlay.open{opacity:1;pointer-events:auto;}
.sheet{
  width:100%;max-width:640px;background:var(--paper);
  border-radius:24px 24px 0 0;padding:8px 18px calc(22px + env(safe-area-inset-bottom,0px));
  max-height:88dvh;overflow-y:auto;
  transform:translateY(14px);transition:transform .18s ease;
}
.overlay.open .sheet{transform:translateY(0);}
.sheet-handle{width:38px;height:4px;border-radius:3px;background:var(--line);margin:8px auto 14px;}
.sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:16px;}
.sheet-head h2{font-size:19px;}
.sheet-head .close{
  width:30px;height:30px;border-radius:9px;background:var(--surface-2);border:none;
  display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-dim);flex:none;
}
.sheet-head .close svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;}
#logoutBtn svg{width:16px;height:16px;stroke:var(--brand-ink);fill:none;stroke-width:1.8;}
.sheet-sub{font-size:12.5px;color:var(--ink-dim);margin-top:-10px;margin-bottom:16px;}

.divider{height:1px;background:var(--line);margin:18px 0;}

table.plain{width:100%;border-collapse:collapse;font-size:13px;}
table.plain th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-dim);padding:0 8px 9px 0;font-weight:700;border-bottom:1.5px solid var(--ink);}
table.plain td{padding:9px 8px 9px 0;border-top:1px solid var(--line);}
table.plain td.mono{text-align:right;}
table.plain tbody tr:nth-child(even){background:var(--surface-2);}
table.plain tbody tr:nth-child(even) td{padding-left:8px;}

/* ---------------- KPI şeridi (Özet ve diğer ekranlarda üst özet kutucukları) ---------------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:20px;}
.kpi{background:var(--surface);padding:12px 16px;}
.kpi .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-dim);font-weight:700;}
.kpi .val{font-family:var(--font-mono);font-size:19px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums;}
.kpi.warn .val{color:var(--warning);}
.kpi.bad .val{color:var(--danger);}
.kpi.good .val{color:var(--success);}
.kpi .delta{font-size:10.5px;color:var(--ink-dim);margin-top:2px;}

/* ---------------- Kayıt tablosu (Daireler / Giderler / Personel gibi listeler) ---------------- */
.table-card{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;}
.table-card .table-card-head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);gap:10px;flex-wrap:wrap;}
.table-card .table-card-head h2{font-family:var(--font-display);font-size:14.5px;font-weight:600;margin:0;}
.table-scroll{overflow-x:auto;}
table.table-pro{width:100%;border-collapse:collapse;font-size:12.5px;}
table.table-pro thead th{background:var(--surface-2);text-align:left;padding:9px 14px;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-dim);font-weight:700;border-bottom:1px solid var(--line);white-space:nowrap;}
table.table-pro thead th.num{text-align:right;}
table.table-pro tbody td{padding:8px 14px;border-bottom:1px solid var(--line);color:var(--ink);white-space:nowrap;}
table.table-pro tbody td.num{text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
table.table-pro tbody tr:nth-child(even){background:var(--surface-2);}
table.table-pro tbody tr{cursor:pointer;}
table.table-pro tbody tr:hover{background:var(--gold-soft);}
table.table-pro .name-cell{font-weight:700;}
.table-foot-row{padding:9px 16px;font-size:11px;color:var(--ink-dim);border-top:1px solid var(--line);display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;}

.empty{padding:40px 16px;text-align:center;color:var(--ink-dim);}
.empty svg{width:34px;height:34px;stroke:var(--ink-dim);fill:none;stroke-width:1.5;margin-bottom:10px;}

.toast{
  position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(10px);
  background:var(--ink);color:var(--paper);padding:11px 18px;border-radius:12px;font-size:13.5px;font-weight:600;
  box-shadow:var(--shadow);z-index:60;opacity:0;pointer-events:none;transition:all .2s ease;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

.gate{
  min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;
  background:var(--brand);
}
.gate-card{background:var(--paper);border-radius:20px;padding:28px 24px;max-width:400px;width:100%;box-shadow:var(--shadow);}
.gate-card h1{font-size:20px;margin-bottom:8px;}
.gate-card p{color:var(--ink-dim);font-size:13.5px;line-height:1.5;margin:0 0 16px;}
.gate-card code{background:var(--surface-2);padding:2px 6px;border-radius:6px;font-family:var(--font-mono);font-size:12px;}

.spinner{width:22px;height:22px;border-radius:50%;border:3px solid var(--surface-2);border-top-color:var(--brand);animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.center-pad{display:flex;align-items:center;justify-content:center;padding:60px 0;}

/* login */
.gate form{display:flex;flex-direction:column;gap:12px;}
.gate .err{color:var(--danger);font-size:13px;font-weight:600;min-height:16px;}

/* chat */
.chat-wrap{display:flex;flex-direction:column;height:calc(100dvh - 190px);background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;}
.chat-log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;}
.msg{max-width:84%;padding:11px 14px;border-radius:16px;font-size:14px;line-height:1.45;white-space:pre-wrap;}
.msg.user{align-self:flex-end;background:var(--brand);color:var(--brand-ink);border-bottom-right-radius:5px;}
.msg.bot{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:5px;box-shadow:var(--shadow);}
.msg.bot.loading{color:var(--ink-dim);font-style:italic;}
.chat-input-bar{display:flex;gap:8px;padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface);}
.chat-input-bar input{flex:1;border:1px solid var(--line);background:var(--surface-2);border-radius:14px;padding:11px 14px;font:inherit;font-size:14.5px;color:var(--ink);outline:none;}
.chat-input-bar input:focus{border-color:var(--brand);}
.chat-input-bar button{width:44px;height:44px;border-radius:13px;background:var(--brand);color:var(--brand-ink);border:none;display:flex;align-items:center;justify-content:center;flex:none;cursor:pointer;}
.chat-input-bar button svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;}
.chat-input-bar button:disabled{opacity:.5;}
.chat-suggest{display:flex;gap:8px;flex-wrap:wrap;padding:0 16px 12px;}
.chat-suggest button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 13px;font-size:12.5px;font-weight:600;color:var(--ink-dim);cursor:pointer;}

/* reports hub row icon */
.report-icon{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:none;background:var(--brand-soft);color:var(--brand);}
.report-icon svg{stroke:currentColor;fill:none;stroke-width:1.7;}
.yasal-check{flex:none;width:26px;height:26px;border-radius:8px;border:1.5px solid var(--line);background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;}
.yasal-check svg{stroke:currentColor;fill:none;stroke-width:2;width:16px;height:16px;}
.yasal-check.checked{border-color:var(--success);background:var(--success-soft);color:var(--success);}

/* print */
@media print{
  body *{ visibility:hidden; }
  #printArea, #printArea *{ visibility:visible; }
  #printArea{ position:absolute; left:0; top:0; width:100%; padding:10px 4px; }
  .no-print{ display:none !important; }
}
</style>
</head>
<body>

<div id="gate" class="gate hide">
  <div class="gate-card">
    <h1>Nizam</h1>
    <p>Devam etmek için giriş kodunu girin.</p>
    <form id="loginForm">
      <div class="field" style="margin-bottom:6px;"><label>Giriş Kodu</label><input id="loginPassword" type="password" inputmode="text" autocomplete="current-password" required /></div>
      <div class="err" id="loginErr"></div>
      <button class="btn btn-primary btn-block" type="submit" id="loginBtn">Giriş Yap</button>
    </form>
  </div>
</div>

<div id="app" class="hide"></div>

<div id="toast" class="toast"></div>

<script>
/* ====================================================================
   ZEYTİNKULE DEFTERİ — uygulama mantığı
==================================================================== */

const MONTH_NAMES = {'01':'Ocak','02':'Şubat','03':'Mart','04':'Nisan','05':'Mayıs','06':'Haziran',
                      '07':'Temmuz','08':'Ağustos','09':'Eylül','10':'Ekim','11':'Kasım','12':'Aralık'};

function monthLabel(donem){ // 'YYYY-MM' -> 'Haziran 2026'
  if(!donem) return '';
  const [y,m] = donem.split('-');
  return `${MONTH_NAMES[m]||m} ${y}`;
}
function monthShort(donem){ // 'YYYY-MM' -> 'Haz'
  if(!donem) return '';
  return (MONTH_NAMES[donem.slice(5,7)]||'').slice(0,3);
}
function tl(n){
  if(n===null||n===undefined||n==='') return '—';
  return Number(n).toLocaleString('tr-TR',{maximumFractionDigits:0})+' ₺';
}
function esc(s){ return (s===null||s===undefined) ? '' : String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function todayISO(){ const d=new Date(); return d.toISOString().slice(0,10); }
function nowMonth(){ const d=new Date(); return d.toISOString().slice(0,7); }

const STATE = {
  isletmeler: [],       // {id, ad, tip:'site'|'genel'} — Zeytinkule, ofisler, inşaatlar
  currentIsletmeId: null,
  apartments: [],
  payments: [],      // all rows from `payments`
  expenses: [],
  gelirler: [],       // 'genel' tipi işletmelerde serbest açıklamalı gelir kayıtları
  staff: [],
  staffPayments: [],
  maintenanceItems: [], // bakım kalemleri (asansör, yangın tüpü vb.)
  contracts: [],      // 'genel' tipi işletmelerde satılık/kiralık kontrat kayıtları
  projeler: [],       // 'genel' tipi işletmelerde şirket içindeki inşaat/mimarlık projeleri
  projeView: null,    // Projeler sekmesinde liste mi (null) yoksa hangi projenin detayı açık ('genel' ya da proje id)
  months: [],         // sorted list of aidat donem values, e.g. ['2026-06','2026-07','2026-08']
  currentMonth: null,
  tab: 'ozet',
  search: '',
  chat: [],           // {role:'user'|'assistant', content:string}
  settings: {},       // key-value store: yasal checklist, genel kurul notu vb.
  settingsLoaded: false,
};

function currentIsletme(){
  return STATE.isletmeler.find(i=>i.id===STATE.currentIsletmeId) || null;
}
function isSiteTipi(){
  const i = currentIsletme();
  return !i || i.tip==='site';
}

/* ---------------------------- API HELPER ---------------------------- */
function authToken(){ return localStorage.getItem('zk_token'); }
async function api(path, opts={}){
  const res = await fetch(path, {
    method: opts.method || 'GET',
    headers: {
      'Content-Type': 'application/json',
      ...(authToken() ? {'Authorization': 'Bearer '+authToken()} : {}),
    },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  if(res.status===401){
    localStorage.removeItem('zk_token');
    showGate();
    throw new Error('Oturum sona erdi, tekrar giriş yapın');
  }
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error || ('İstek başarısız ('+res.status+')'));
  return data;
}

function paymentFor(no, tur, donem){
  return STATE.payments.find(p=>p.apartment_no===no && p.tur===tur && p.donem===donem);
}
function monthPayments(donem){
  return STATE.payments.filter(p=>p.tur==='aidat' && p.donem===donem);
}

/* ---------------------------- DAİRE DURUMU / CARİ HESAP ---------------------------- */
const DURUM_META = {
  ev_sahibi:      {label:'Ev Sahibi Oturuyor'},
  kiraci:         {label:'Kiracı Oturuyor'},
  bos_odeniyor:   {label:'Boş — Aidat Ödeniyor'},
  bos_muaf:       {label:'Boş — Aidattan Muaf'},
};
function durumLabel(a){
  if(!a) return '';
  const meta = DURUM_META[a.durum] || DURUM_META.ev_sahibi;
  if(a.durum==='kiraci' && a.kiraci_adi) return meta.label+' ('+a.kiraci_adi+')';
  return meta.label;
}
function isMuaf(a){ return a && a.durum==='bos_muaf'; }

// Bir dairenin "cari hesap" bakiyesi: demirbaş + (muaf değilse) tüm aylık aidatlar,
// standart aidat tutarına göre. Standart tutar Ayarlar'dan girilir (settings.standart_aidat_tutari).
function computeAptBalance(no){
  const a = STATE.apartments.find(x=>x.no===no);
  const standart = Number(STATE.settings.standart_aidat_tutari)||0;
  const muaf = isMuaf(a);
  let borc = 0, odenen = 0;
  const dem = paymentFor(no,'demirbas','tek');
  if(dem){ borc += Number(dem.tutar_beklenen)||0; odenen += Number(dem.tutar_odenen)||0; }
  if(!muaf){
    STATE.months.forEach(m=>{
      const r = paymentFor(no,'aidat',m);
      borc += standart;
      odenen += r ? (Number(r.tutar_odenen)||0) : 0;
    });
  }
  return {borc, odenen, kalan: borc-odenen, muaf};
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>t.classList.remove('show'), 2200);
}

/* ---------------------------- BOOT / AUTH ---------------------------- */
function showGate(){
  document.getElementById('app').classList.add('hide');
  document.getElementById('gate').classList.remove('hide');
}
function showApp(){
  document.getElementById('gate').classList.add('hide');
  document.getElementById('app').classList.remove('hide');
}

async function boot(){
  document.getElementById('loginForm').onsubmit = async (e)=>{
    e.preventDefault();
    const password = document.getElementById('loginPassword').value;
    const errEl = document.getElementById('loginErr');
    const btn = document.getElementById('loginBtn');
    errEl.textContent = ''; btn.disabled = true; btn.textContent = 'Giriş yapılıyor...';
    try{
      const res = await fetch('/api/login', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({password})});
      const data = await res.json();
      if(!res.ok) throw new Error(data.error || 'Giriş başarısız');
      localStorage.setItem('zk_token', data.token);
      await startApp();
    }catch(err){
      errEl.textContent = err.message;
    }finally{
      btn.disabled = false; btn.textContent = 'Giriş Yap';
    }
  };

  if(authToken()){
    try{ await startApp(); return; }
    catch(err){ localStorage.removeItem('zk_token'); }
  }
  showGate();
}

async function startApp(){
  showApp();
  document.getElementById('app').innerHTML = `<div class="center-pad"><div class="spinner"></div></div>`;
  await loadIsletmeler();
  await loadAll();
  await loadSettings();
  render();
}

async function loadIsletmeler(){
  STATE.isletmeler = await api('/api/isletmeler');
  const saved = Number(localStorage.getItem('zk_isletme_id'));
  if(saved && STATE.isletmeler.some(i=>i.id===saved)) STATE.currentIsletmeId = saved;
  else STATE.currentIsletmeId = STATE.isletmeler[0]?.id || null;
}

async function switchIsletme(id){
  STATE.currentIsletmeId = id;
  localStorage.setItem('zk_isletme_id', id);
  STATE.tab = 'ozet';
  STATE.currentMonth = null;
  STATE.projeView = null;
  STATE.settingsLoaded = false;
  document.getElementById('app').innerHTML = `<div class="center-pad"><div class="spinner"></div></div>`;
  await loadAll();
  await loadSettings();
  render();
}

async function loadAll(){
  if(!STATE.currentIsletmeId) return;
  try{
    const data = await api('/api/data?isletme_id='+STATE.currentIsletmeId);
    STATE.apartments = data.apartments||[];
    STATE.payments = data.payments||[];
    STATE.expenses = data.expenses||[];
    STATE.gelirler = data.gelirler||[];
    STATE.staff = data.staff||[];
    STATE.staffPayments = data.staffPayments||[];
    STATE.maintenanceItems = data.maintenanceItems||[];
    STATE.contracts = data.contracts||[];
    STATE.projeler = data.projeler||[];
    STATE.months = [...new Set(STATE.payments.filter(x=>x.tur==='aidat').map(x=>x.donem))].sort();

    // Takvimde yeni bir ay başladıysa (ve daha önce en az bir ay oluşturulmuşsa),
    // o ayı tüm daireler için otomatik oluştur — elle "+ Yeni Ay Ekle" yapmaya gerek kalmasın.
    const curReal = nowMonth();
    if(isSiteTipi() && STATE.months.length && !STATE.months.includes(curReal)){
      try{
        const created = await api('/api/months', {method:'POST', body:{isletme_id:STATE.currentIsletmeId, donem:curReal}});
        STATE.payments.push(...created);
        STATE.months = [...new Set(STATE.payments.filter(x=>x.tur==='aidat').map(x=>x.donem))].sort();
        showToast(monthLabel(curReal)+' otomatik olarak oluşturuldu');
      }catch(e){ console.error('Otomatik ay oluşturma başarısız:', e); }
    }

    if(!STATE.currentMonth || !STATE.months.includes(STATE.currentMonth)){
      STATE.currentMonth = STATE.months[STATE.months.length-1] || null;
    }
  }catch(err){
    showToast('Bağlantı hatası: '+err.message);
    console.error(err);
    throw err;
  }
}

function logout(){
  localStorage.removeItem('zk_token');
  showGate();
}

/* ---------------------------- ROOT RENDER ---------------------------- */
function render(){
  const app = document.getElementById('app');
  app.innerHTML = `<div class="shell">${renderSidebar()}<main id="main"></main></div>`;
  renderMain();
}

function renderSidebar(){
  const monthOptions = STATE.months.map(m=>`<option value="${m}" ${m===STATE.currentMonth?'selected':''}>${monthLabel(m)}</option>`).join('');
  const i = currentIsletme();
  const ad = i?.ad || 'Yükleniyor...';
  const tabs = tabsFor();
  if(!tabs.some(t=>t.id===STATE.tab)) STATE.tab = 'ozet';
  const showMonthPill = isSiteTipi() && (STATE.tab==='ozet'||STATE.tab==='daireler') && STATE.months.length;
  return `
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="mark">N</div>
      <div class="name">Nizam</div>
    </div>
    <button class="isletme-pill" id="isletmeBtn" type="button">
      <span style="min-width:0;">
        <span style="opacity:.75;">İşletme</span>
        <b>${esc(ad)}</b>
      </span>
      <svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg>
    </button>
    ${showMonthPill ? `
    <div class="month-pill">
      ${ICON.calendar}
      <select id="monthSelect">${monthOptions}</select>
    </div>` : ''}
    <nav>
      ${tabs.map(t=>`
        <button data-tab="${t.id}" class="${STATE.tab===t.id?'active':''}" type="button">
          ${ICON[t.icon]}
          <span>${t.label}</span>
        </button>`).join('')}
    </nav>
    <div class="sidebar-foot">
      Yönetici
      <button id="logoutBtn" type="button">${ICON.logout} Çıkış Yap</button>
    </div>
  </aside>`;
}

function tabsFor(){
  if(isSiteTipi()){
    return [
      {id:'ozet', label:'Özet', icon:'home'},
      {id:'daireler', label:'Daireler', icon:'building'},
      {id:'asistan', label:'Asistan', icon:'chat'},
      {id:'giderler', label:'Giderler', icon:'receipt'},
      {id:'personel', label:'Personel', icon:'users'},
    ];
  }
  return [
    {id:'ozet', label:'Özet', icon:'home'},
    {id:'projeler', label:'Projeler', icon:'proje'},
    {id:'gelir', label:'Gelir', icon:'box'},
    {id:'kontratlar', label:'Kontratlar', icon:'contract'},
    {id:'asistan', label:'Asistan', icon:'chat'},
    {id:'giderler', label:'Giderler', icon:'receipt'},
    {id:'personel', label:'Personel', icon:'users'},
  ];
}

const ADD_BTN_LABEL = {
  daireler: 'Yeni Ay Ekle',
  projeler: 'Yeni Proje',
  gelir: 'Yeni Gelir',
  kontratlar: 'Yeni Kontrat',
  giderler: 'Yeni Gider',
  personel: 'Yeni Personel',
};

function renderMain(){
  const main = document.getElementById('main');
  const tabs = tabsFor();
  const tabMeta = tabs.find(t=>t.id===STATE.tab) || tabs[0];
  const i = currentIsletme();
  const altYazi = i ? (i.tip==='site' ? 'Bina Yönetim Defteri' : 'İşletme Defteri') : '';
  const addLabel = (STATE.tab==='projeler' && STATE.projeView!==null) ? null : ADD_BTN_LABEL[STATE.tab];
  const header = `
    <div class="page-head">
      <div>
        <h1>${esc(tabMeta?.label||'')}</h1>
        <div class="sub">${esc(i?.ad||'')}${altYazi?' · '+altYazi:''}</div>
      </div>
      ${addLabel ? `<div class="actions"><button class="btn-toolbar gold" id="pageAddBtn" type="button">${ICON.plus} ${addLabel}</button></div>` : ''}
    </div>
  `;
  let body = '';
  if(STATE.tab==='ozet') body = renderOzet();
  else if(STATE.tab==='daireler') body = renderDaireler();
  else if(STATE.tab==='projeler') body = renderProjeler();
  else if(STATE.tab==='gelir') body = renderGelir();
  else if(STATE.tab==='kontratlar') body = renderKontratlar();
  else if(STATE.tab==='asistan') body = renderAsistan();
  else if(STATE.tab==='giderler') body = renderGiderler();
  else if(STATE.tab==='personel') body = renderPersonel();
  main.innerHTML = header + body;
  wireMain();
  if(STATE.tab==='asistan') wireAsistan();
  const addBtn = document.getElementById('pageAddBtn');
  if(addBtn) addBtn.onclick = onFab;
}

document.addEventListener('click', (e)=>{
  const tabBtn = e.target.closest('.sidebar nav button');
  if(tabBtn){ STATE.tab = tabBtn.dataset.tab; STATE.projeView = null; render(); return; }
  if(e.target.closest('#isletmeBtn')){ openIsletmeSecSheet(); return; }
  if(e.target.closest('#logoutBtn')){ logout(); return; }
});
document.addEventListener('change', (e)=>{
  if(e.target.id==='monthSelect'){ STATE.currentMonth = e.target.value; renderMain(); }
});

function onFab(){
  if(STATE.tab==='giderler') openExpenseSheet(null);
  else if(STATE.tab==='gelir') openGelirSheet(null);
  else if(STATE.tab==='kontratlar') openContractSheet(null);
  else if(STATE.tab==='projeler') openProjeSheet(null);
  else if(STATE.tab==='personel') openStaffSheet(null);
  else if(STATE.tab==='daireler') openAddMonthSheet();
  else STATE.tab='daireler', render();
}

/* ---------------------------- İŞLETME SEÇİCİ ---------------------------- */
function openIsletmeSecSheet(){
  const html = `
    <div class="sheet-head">
      <h2>İşletme Seç</h2>
      <button class="close" data-close-sheet>${ICON.x}</button>
    </div>
    <div class="row-list">
      ${STATE.isletmeler.map(i=>`
        <div class="apt-row" data-pick-isletme="${i.id}">
          <div class="apt-no" style="border-radius:11px;">${esc((i.ad||'?').slice(0,1).toUpperCase())}</div>
          <div class="apt-info">
            <div class="name">${esc(i.ad)}</div>
            <div class="kat">${i.tip==='site'?'Site / Bina':'Ofis veya İnşaat'}</div>
          </div>
          ${i.id===STATE.currentIsletmeId ? ICON.checkCircle : ''}
        </div>`).join('')}
    </div>
    <button class="btn btn-ghost btn-block" id="yeniIsletmeBtn" style="margin-top:14px;">${ICON.plus} Yeni İşletme Ekle</button>
    <button class="btn btn-ghost btn-block" id="yedekBtn" style="margin-top:10px;">${ICON.reportIcon} Tüm Veriyi Excel'e Yedekle</button>
    <button class="btn btn-danger btn-block" id="sheetLogoutBtn" style="margin-top:10px;">Çıkış Yap</button>
  `;
  openSheet(html);
  document.querySelectorAll('[data-pick-isletme]').forEach(el=>{
    el.onclick = async ()=>{
      const id = Number(el.dataset.pickIsletme);
      closeSheet();
      if(id!==STATE.currentIsletmeId) await switchIsletme(id);
    };
  });
  document.getElementById('yeniIsletmeBtn').onclick = openYeniIsletmeSheet;
  document.getElementById('yedekBtn').onclick = exportTumVeriYedek;
  document.getElementById('sheetLogoutBtn').onclick = logout;
}

async function exportTumVeriYedek(){
  if(typeof XLSX==='undefined'){ showToast('Excel modülü yüklenemedi, internet bağlantınızı kontrol edin'); return; }
  showToast('Yedek hazırlanıyor...');
  const wb = XLSX.utils.book_new();
  const usedNames = new Set();
  for(const isl of STATE.isletmeler){
    let data;
    try{ data = await api('/api/data?isletme_id='+isl.id); }
    catch(err){ continue; }
    const rows = [];
    rows.push([isl.ad + ' — ' + (isl.tip==='site' ? 'Site / Bina' : 'Ofis / İnşaat')]);
    rows.push(['Yedek tarihi', new Date().toLocaleDateString('tr-TR')]);
    rows.push([]);
    if(isl.tip==='site'){
      rows.push(['DAİRELER']);
      rows.push(['No','Malik','Durum','Kiracı Adı']);
      (data.apartments||[]).forEach(a=>rows.push([a.no, a.malik||'', a.durum||'', a.kiraci_adi||'']));
      rows.push([]);
      rows.push(['ÖDEMELER']);
      rows.push(['Daire No','Tür','Dönem','Tutar Ödenen','Durum']);
      (data.payments||[]).forEach(p=>rows.push([p.apartment_no, p.tur, p.donem, p.tutar_odenen, p.durum]));
    } else {
      rows.push(['GELİRLER']);
      rows.push(['Açıklama','Tutar','Tarih','Durum','Not']);
      (data.gelirler||[]).forEach(g=>rows.push([g.aciklama||'', g.tutar, g.tarih||'', g.durum||'', g.not_metni||'']));
    }
    rows.push([]);
    rows.push(['GİDERLER']);
    rows.push(['Ay','Gider Türü','Firma','Tutar','Tarih','Durum']);
    (data.expenses||[]).forEach(e=>rows.push([e.ay||'', e.gider_turu||'', e.firma||'', e.tutar, e.tarih||'', e.durum||'']));
    rows.push([]);
    rows.push(['PERSONEL']);
    rows.push(['İsim','Görev','Aylık Ücret']);
    (data.staff||[]).forEach(s=>rows.push([s.isim||'', s.gorev||'', s.aylik_ucret]));

    let sheetName = (isl.ad||('İşletme '+isl.id)).replace(/[\\/*?:\[\]]/g,'').slice(0,31) || ('Isletme'+isl.id);
    let n = 2;
    while(usedNames.has(sheetName)){ sheetName = sheetName.slice(0, 28)+'-'+n; n++; }
    usedNames.add(sheetName);
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), sheetName);
  }
  XLSX.writeFile(wb, 'tum-isletmeler-yedek-'+todayISO()+'.xlsx');
  showToast('Yedek indirildi');
}

function openYeniIsletmeSheet(){
  const html = `
    <div class="sheet-head">
      <h2>Yeni İşletme Ekle</h2>
      <button class="close" data-close-sheet>${ICON.x}</button>
    </div>
    <div class="field"><label>İsim</label><input id="ni_ad" placeholder="örn. Ofis 2, İnşaat A" /></div>
    <div class="field">
      <label>Tip</label>
      <div class="seg">
        <button type="button" data-tip="genel" class="on odendi">Ofis / İnşaat (Gelir-Gider)</button>
        <button type="button" data-tip="site" class="">Site / Bina (Daireler)</button>
      </div>
    </div>
    <button class="btn btn-primary btn-block" id="ni_kaydet">Oluştur</button>
  `;
  openSheet(html);
  let tip = 'genel';
  document.querySelectorAll('[data-tip]').forEach(b=>{
    b.onclick = ()=>{
      document.querySelectorAll('[data-tip]').forEach(x=>x.className='');
      tip = b.dataset.tip;
      b.className = 'on odendi';
    };
  });
  document.getElementById('ni_kaydet').onclick = async ()=>{
    const ad = document.getElementById('ni_ad').value.trim();
    if(!ad){ showToast('Bir isim yazın'); return; }
    try{
      const yeni = await api('/api/isletmeler', {method:'POST', body:{ad, tip}});
      STATE.isletmeler.push(yeni);
      closeSheet();
      await switchIsletme(yeni.id);
      showToast(ad+' eklendi');
    }catch(err){ showToast('Eklenemedi: '+err.message); }
  };
}
