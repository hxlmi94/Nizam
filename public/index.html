<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Nizam</title>
<meta name="theme-color" content="#132A47" />

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="manifest" href="/manifest.json">

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* ============================= TOKENS ============================= */
:root{
  --paper:#EEF1F5;
  --surface:#FFFFFF;
  --surface-2:#E6EAF0;
  --ink:#161F2B;
  --ink-dim:#5B6B7D;
  --line:#D3DAE3;
  --brand:#132A47;
  --brand-2:#1F3D63;
  --brand-ink:#F1F5F9;
  --brand-soft:#E1E8F0;
  --gold:#AD8A48;
  --gold-line:#C6A25C;
  --gold-soft:#F4ECD8;
  --success:#227A55;
  --success-soft:#DCEFE4;
  --warning:#B5791F;
  --warning-soft:#FAEBD3;
  --danger:#B23B2E;
  --danger-soft:#F7E0DB;
  --neutral-chip:#E3E7EC;
  --shadow: 0 1px 2px rgba(15,25,38,.07), 0 8px 22px -12px rgba(15,25,38,.20);
  --radius-s:7px;
  --radius-m:11px;
  --radius-l:15px;
  --font-display:'Fraunces', Georgia, serif;
  --font-body:'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono:'IBM Plex Mono', ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F141C;
    --surface:#161E29;
    --surface-2:#1C2632;
    --ink:#E7ECF2;
    --ink-dim:#93A3B4;
    --line:#2B3644;
    --brand:#7FA0C9;
    --brand-2:#9CB6D6;
    --brand-ink:#0A0F16;
    --brand-soft:#1D2A3A;
    --gold:#D3AE72;
    --gold-line:#E0BE86;
    --gold-soft:#2E2717;
    --success:#5FBE93;
    --success-soft:#17322A;
    --warning:#E0A94E;
    --warning-soft:#33270F;
    --danger:#E08A7A;
    --danger-soft:#34211C;
    --neutral-chip:#28323E;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --paper:#0F141C;
  --surface:#161E29;
  --surface-2:#1C2632;
  --ink:#E7ECF2;
  --ink-dim:#93A3B4;
  --line:#2B3644;
  --brand:#7FA0C9;
  --brand-2:#9CB6D6;
  --brand-ink:#0A0F16;
  --brand-soft:#1D2A3A;
  --gold:#D3AE72;
  --gold-line:#E0BE86;
  --gold-soft:#2E2717;
  --success:#5FBE93;
  --success-soft:#17322A;
  --warning:#E0A94E;
  --warning-soft:#33270F;
  --danger:#E08A7A;
  --danger-soft:#34211C;
  --neutral-chip:#28323E;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
}

*{box-sizing:border-box;}
svg{width:20px;height:20px;flex-shrink:0;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  min-height:100dvh;
  overflow-x:hidden;
}
h1,h2,h3{font-family:var(--font-display);font-weight:600;letter-spacing:-.01em;text-wrap:balance;margin:0;}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
button{font-family:inherit;}
::selection{background:var(--gold-soft);}
a{color:inherit;}

/* ============================= LAYOUT (bilgisayar sistemi görünümü) ============================= */
#app{min-height:100dvh;position:relative;}
.shell{display:grid;grid-template-columns:222px 1fr;min-height:100dvh;}
.hide{display:none !important;}

.sidebar{
  background:linear-gradient(180deg, var(--brand-2), var(--brand) 70%);color:var(--brand-ink);
  padding:18px 14px;display:flex;flex-direction:column;
  position:sticky;top:0;height:100dvh;overflow-y:auto;
}
.sidebar-brand{display:flex;align-items:center;gap:9px;padding:4px 6px 18px;border-bottom:1px solid rgba(255,255,255,.14);margin-bottom:14px;}
.sidebar-brand .mark{
  width:30px;height:30px;border-radius:8px;border:1px solid var(--gold-line);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-weight:700;color:var(--gold-line);font-size:15px;flex:none;
}
.sidebar-brand .name{font-family:var(--font-display);font-weight:700;font-size:16px;}
.isletme-pill{
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:9px;
  padding:9px 10px;font-size:11px;color:rgba(241,245,249,.72);margin-bottom:16px;
  display:flex;justify-content:space-between;align-items:center;gap:6px;
  cursor:pointer;text-align:left;width:100%;font-family:inherit;
}
.isletme-pill b{color:var(--brand-ink);font-size:12.5px;display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.isletme-pill svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.2;flex:none;opacity:.7;}
.month-pill{
  display:flex;align-items:center;gap:6px;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);color:var(--brand-ink);
  border-radius:9px;padding:8px 10px;font-size:12px;font-weight:600;margin-bottom:16px;
}
.month-pill select{background:transparent;border:none;color:inherit;font:inherit;font-weight:700;-webkit-appearance:none;appearance:none;width:100%;}
.month-pill select option{color:#111;}
.month-pill svg{width:14px;height:14px;stroke:var(--brand-ink);fill:none;stroke-width:1.8;opacity:.85;flex:none;}

.sidebar nav{display:flex;flex-direction:column;gap:2px;}
.sidebar nav button{
  color:rgba(241,245,249,.72);text-decoration:none;font-size:12.5px;font-weight:600;
  padding:9px 10px;border-radius:7px;display:flex;align-items:center;gap:9px;letter-spacing:.01em;
  background:none;border:none;cursor:pointer;font-family:inherit;text-align:left;width:100%;
}
.sidebar nav button svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;opacity:.85;flex:none;}
.sidebar nav button.active{background:rgba(255,255,255,.1);color:#fff;box-shadow:inset 2px 0 0 var(--gold-line);}
.sidebar nav button.active svg{opacity:1;}
.sidebar-foot{margin-top:auto;padding-top:14px;border-top:1px solid rgba(255,255,255,.14);font-size:11px;color:rgba(241,245,249,.55);}
.sidebar-foot button{margin-top:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);color:var(--brand-ink);border-radius:7px;padding:6px 9px;font-size:11px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;font-family:inherit;}
.sidebar-foot button svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8;}

main{padding:22px 26px 60px;max-width:1280px;}

.page-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap;}
.page-head h1{font-family:var(--font-display);font-size:20px;font-weight:600;}
.page-head .sub{color:var(--ink-dim);font-size:12px;margin-top:2px;}
.page-head .actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.btn-toolbar{
  display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);
  color:var(--ink);border-radius:7px;padding:8px 14px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;
}
.btn-toolbar.gold{background:var(--brand);color:var(--gold-soft);border-color:var(--brand);}
.btn-toolbar svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.3;}

/* Responsive: dar ekranda (telefon) kenar çubuğu üstte yatay bir şeride dönüşür */
@media (max-width:899px){
  .shell{grid-template-columns:1fr;}
  .sidebar{position:sticky;top:0;height:auto;flex-direction:row;flex-wrap:nowrap;align-items:center;overflow-x:auto;overflow-anchor:none;padding:10px 12px;z-index:20;}
  .sidebar-brand{flex:none;border-bottom:none;margin-bottom:0;padding:0 12px 0 0;border-right:1px solid rgba(255,255,255,.14);}
  .isletme-pill{flex:none;width:auto;margin-bottom:0;margin-left:10px;}
  .month-pill{flex:none;margin-bottom:0;margin-left:10px;}
  .sidebar nav{flex:none;flex-direction:row;margin-left:10px;}
  .sidebar nav button{flex:none;width:auto;white-space:nowrap;}
  .sidebar-foot{flex:none;margin-top:0;margin-left:auto;padding-top:0;border-top:none;display:flex;align-items:center;}
  .sidebar-foot button{flex:none;margin-top:0;margin-left:10px;}
  main{padding:16px 16px 40px;}
}

/* ============================= COMPONENTS ============================= */
.section-title{
  font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-dim);
  font-weight:700;margin:22px 2px 10px;
  display:flex;align-items:center;gap:8px;
}
.section-title::before{content:'';width:14px;height:2px;background:var(--gold-line);flex:none;}
.section-title:first-child{margin-top:2px;}

.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);
  box-shadow:var(--shadow);
}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.stat-card{
  background:var(--surface);border:1px solid var(--line);border-top:2.5px solid var(--gold-line);
  border-radius:var(--radius-m);
  padding:13px 15px 14px;box-shadow:var(--shadow);
}
.stat-card .label{font-size:11.5px;color:var(--ink-dim);font-weight:700;text-transform:uppercase;letter-spacing:.04em;}
.stat-card .value{font-family:var(--font-display);font-size:24px;font-weight:600;margin-top:6px;letter-spacing:-.01em;}
.stat-card .value.small{font-size:19px;}
.stat-card .sub{font-size:12px;color:var(--ink-dim);margin-top:3px;}

.alert-card{
  display:flex;gap:11px;align-items:flex-start;
  background:var(--warning-soft);border:1px solid color-mix(in srgb, var(--warning) 35%, transparent);
  border-radius:var(--radius-m);padding:13px 14px;margin-bottom:9px;
}
.alert-card .dot{width:8px;height:8px;border-radius:50%;background:var(--warning);margin-top:6px;flex:none;}
.alert-card svg{width:18px;height:18px;flex:none;margin-top:1px;stroke:var(--warning);fill:none;stroke-width:1.7;}
.alert-card b{font-weight:700;}
.alert-card p{margin:2px 0 0;font-size:12.5px;color:var(--ink-dim);}

.row-list{display:flex;flex-direction:column;gap:8px;}
.apt-row{
  display:flex;align-items:center;gap:12px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);
  padding:11px 13px;box-shadow:var(--shadow);cursor:pointer;
  transition:transform .12s ease;
}
.apt-row:active{transform:scale(.985);}
.apt-no{
  width:38px;height:38px;border-radius:11px;background:var(--surface-2);
  display:flex;align-items:center;justify-content:center;flex:none;
  font-family:var(--font-mono);font-weight:600;font-size:14px;color:var(--ink);
}
.apt-info{flex:1;min-width:0;}
.apt-info .name{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.apt-info .kat{font-size:11.5px;color:var(--ink-dim);margin-top:1px;}
.apt-amount{font-family:var(--font-mono);font-size:13px;font-weight:600;color:var(--ink-dim);white-space:nowrap;}

.chip{
  display:inline-flex;align-items:center;gap:5px;
  padding:5px 10px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap;
}
.chip.odendi{background:var(--success-soft);color:var(--success);}
.chip.odenmedi{background:var(--neutral-chip);color:var(--ink-dim);}
.chip.kismi{background:var(--warning-soft);color:var(--warning);}
.chip.kontrol{background:var(--warning-soft);color:var(--warning);}
.chip.vermiyor{background:var(--danger-soft);color:var(--danger);}

.searchbar{
  display:flex;align-items:center;gap:9px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--radius-m);padding:10px 13px;margin-bottom:14px;
  box-shadow:var(--shadow);
}
.searchbar svg{width:17px;height:17px;stroke:var(--ink-dim);fill:none;stroke-width:2;flex:none;}
.searchbar input{border:none;background:none;outline:none;font:inherit;font-size:14.5px;color:var(--ink);width:100%;}
.searchbar input::placeholder{color:var(--ink-dim);}


.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:11px 16px;border-radius:12px;border:1px solid transparent;
  font-weight:700;font-size:14px;cursor:pointer;font-family:var(--font-body);
}
.btn-primary{background:var(--brand);color:var(--brand-ink);}
.btn-gold{background:var(--gold);color:#1C2733;}
.btn-ghost{background:var(--surface-2);color:var(--ink);}
.btn-danger{background:var(--danger-soft);color:var(--danger);}
.btn-block{width:100%;}
.btn:disabled{opacity:.5;}

.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-dim);margin-bottom:6px;}
.field input, .field select, .field textarea{
  width:100%;border:1px solid var(--line);background:var(--surface-2);
  border-radius:11px;padding:11px 12px;font:inherit;font-size:14.5px;color:var(--ink);outline:none;
}
.field input:focus, .field select:focus, .field textarea:focus{border-color:var(--brand);}
.field textarea{resize:vertical;min-height:60px;}
.seg{display:flex;gap:7px;flex-wrap:wrap;}
.seg button{
  flex:1;min-width:calc(50% - 4px);padding:10px 8px;border-radius:11px;border:1px solid var(--line);
  background:var(--surface-2);color:var(--ink-dim);font-weight:700;font-size:12.5px;cursor:pointer;
}
.seg button.on{border-color:transparent;box-shadow:inset 0 0 0 1.5px currentColor;}
.seg button.on.odendi{background:var(--success-soft);color:var(--success);}
.seg button.on.odenmedi{background:var(--ink);color:var(--paper);box-shadow:none;}
.seg button.on.kismi{background:var(--warning-soft);color:var(--warning);}
.seg button.on.vermiyor{background:var(--danger-soft);color:var(--danger);}

/* sheet / modal */
.overlay{
  position:fixed;inset:0;background:rgba(15,20,17,.5);z-index:50;
  display:flex;align-items:flex-end;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .18s ease;
}
.overlay.open{opacity:1;pointer-events:auto;}
.sheet{
  width:100%;max-width:640px;background:var(--paper);
  border-radius:24px 24px 0 0;padding:8px 18px calc(22px + env(safe-area-inset-bottom,0px));
  max-height:88dvh;overflow-y:auto;
  transform:translateY(14px);transition:transform .18s ease;
}
.overlay.open .sheet{transform:translateY(0);}
.sheet-handle{width:38px;height:4px;border-radius:3px;background:var(--line);margin:8px auto 14px;}
.sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:16px;}
.sheet-head h2{font-size:19px;}
.sheet-head .close{
  width:30px;height:30px;border-radius:9px;background:var(--surface-2);border:none;
  display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-dim);flex:none;
}
.sheet-head .close svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;}
#logoutBtn svg{width:16px;height:16px;stroke:var(--brand-ink);fill:none;stroke-width:1.8;}
.sheet-sub{font-size:12.5px;color:var(--ink-dim);margin-top:-10px;margin-bottom:16px;}

.divider{height:1px;background:var(--line);margin:18px 0;}

table.plain{width:100%;border-collapse:collapse;font-size:13px;}
table.plain th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-dim);padding:0 8px 9px 0;font-weight:700;border-bottom:1.5px solid var(--ink);}
table.plain td{padding:9px 8px 9px 0;border-top:1px solid var(--line);}
table.plain td.mono{text-align:right;}
table.plain tbody tr:nth-child(even){background:var(--surface-2);}
table.plain tbody tr:nth-child(even) td{padding-left:8px;}

/* ---------------- KPI şeridi (Özet ve diğer ekranlarda üst özet kutucukları) ---------------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:20px;}
.kpi{background:var(--surface);padding:12px 16px;}
.kpi .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-dim);font-weight:700;}
.kpi .val{font-family:var(--font-mono);font-size:19px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums;}
.kpi.warn .val{color:var(--warning);}
.kpi.bad .val{color:var(--danger);}
.kpi.good .val{color:var(--success);}
.kpi .delta{font-size:10.5px;color:var(--ink-dim);margin-top:2px;}

/* ---------------- Kayıt tablosu (Daireler / Giderler / Personel gibi listeler) ---------------- */
.table-card{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;}
.table-card .table-card-head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);gap:10px;flex-wrap:wrap;}
.table-card .table-card-head h2{font-family:var(--font-display);font-size:14.5px;font-weight:600;margin:0;}
.ay-group summary{cursor:pointer;list-style:none;}
.ay-group summary::-webkit-details-marker{display:none;}
.ay-group:not([open]) .table-card-head{border-bottom:none;}
.ay-group .ay-group-chevron svg{transition:transform .15s ease;}
.ay-group[open] .ay-group-chevron svg{transform:rotate(90deg);}
.table-scroll{overflow-x:auto;}
table.table-pro{width:100%;border-collapse:collapse;font-size:12.5px;}
table.table-pro thead th{background:var(--surface-2);text-align:left;padding:9px 14px;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-dim);font-weight:700;border-bottom:1px solid var(--line);white-space:nowrap;}
table.table-pro thead th.num{text-align:right;}
table.table-pro tbody td{padding:8px 14px;border-bottom:1px solid var(--line);color:var(--ink);white-space:nowrap;}
table.table-pro tbody td.num{text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
table.table-pro tbody tr:nth-child(even){background:var(--surface-2);}
table.table-pro tbody tr{cursor:pointer;}
table.table-pro tbody tr:hover{background:var(--gold-soft);}
table.table-pro .name-cell{font-weight:700;}
.table-foot-row{padding:9px 16px;font-size:11px;color:var(--ink-dim);border-top:1px solid var(--line);display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;}

.empty{padding:40px 16px;text-align:center;color:var(--ink-dim);}
.empty svg{width:34px;height:34px;stroke:var(--ink-dim);fill:none;stroke-width:1.5;margin-bottom:10px;}

.toast{
  position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(10px);
  background:var(--ink);color:var(--paper);padding:11px 18px;border-radius:12px;font-size:13.5px;font-weight:600;
  box-shadow:var(--shadow);z-index:60;opacity:0;pointer-events:none;transition:all .2s ease;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

.gate{
  min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;
  background:var(--brand);
}
.gate-card{background:var(--paper);border-radius:20px;padding:28px 24px;max-width:400px;width:100%;box-shadow:var(--shadow);}
.gate-card h1{font-size:20px;margin-bottom:8px;}
.gate-card p{color:var(--ink-dim);font-size:13.5px;line-height:1.5;margin:0 0 16px;}
.gate-card code{background:var(--surface-2);padding:2px 6px;border-radius:6px;font-family:var(--font-mono);font-size:12px;}

.spinner{width:22px;height:22px;border-radius:50%;border:3px solid var(--surface-2);border-top-color:var(--brand);animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.center-pad{display:flex;align-items:center;justify-content:center;padding:60px 0;}

/* login */
.gate form{display:flex;flex-direction:column;gap:12px;}
.gate .err{color:var(--danger);font-size:13px;font-weight:600;min-height:16px;}

/* chat */
.chat-wrap{display:flex;flex-direction:column;height:calc(100dvh - 190px);background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;}
.chat-log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;}
.msg{max-width:84%;padding:11px 14px;border-radius:16px;font-size:14px;line-height:1.45;white-space:pre-wrap;}

.chat-input-bar input{flex:1;border:1px solid var(--line);background:var(--surface-2);border-radius:14px;padding:11px 14px;font:inherit;font-size:14.5px;color:var(--ink);outline:none;}
.chat-input-bar input:focus{border-color:var(--brand);}
.chat-input-bar button{width:44px;height:44px;border-radius:13px;background:var(--brand);color:var(--brand-ink);border:none;display:flex;align-items:center;justify-content:center;flex:none;cursor:pointer;}
.chat-input-bar button svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;}
.chat-input-bar button:disabled{opacity:.5;}
.chat-suggest{display:flex;gap:8px;flex-wrap:wrap;padding:0 16px 12px;}
.chat-suggest button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 13px;font-size:12.5px;font-weight:600;color:var(--ink-dim);cursor:pointer;}

/* reports hub row icon */
.report-icon{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:none;background:var(--brand-soft);color:var(--brand);}
.report-icon svg{stroke:currentColor;fill:none;stroke-width:1.7;}
.yasal-check{flex:none;width:26px;height:26px;border-radius:8px;border:1.5px solid var(--line);background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;}
.yasal-check svg{stroke:currentColor;fill:none;stroke-width:2;width:16px;height:16px;}
.yasal-check.checked{border-color:var(--success);background:var(--success-soft);color:var(--success);}

/* print */
@media print{
  body *{ visibility:hidden; }
  #printArea, #printArea *{ visibility:visible; }
  #printArea{ position:absolute; left:0; top:0; width:100%; padding:10px 4px; }
  .no-print{ display:none !important; }
}
</style>
</head>
<body>

<div id="gate" class="gate hide">
  <div class="gate-card">
    <h1>Nizam</h1>
    <p>Devam etmek için giriş kodunu girin.</p>
    <form id="loginForm">
      <div class="field" style="margin-bottom:6px;"><label>Giriş Kodu</label><input id="loginPassword" type="password" inputmode="text" autocomplete="current-password" required /></div>
      <div class="err" id="loginErr"></div>
      <button class="btn btn-primary btn-block" type="submit" id="loginBtn">Giriş Yap</button>
    </form>
  </div>
</div>

<div id="app" class="hide"></div>

<div id="toast" class="toast"></div>

<script>
/* ====================================================================
   ZEYTİNKULE DEFTERİ — uygulama mantığı
==================================================================== */

const MONTH_NAMES = {'01':'Ocak','02':'Şubat','03':'Mart','04':'Nisan','05':'Mayıs','06':'Haziran',
                      '07':'Temmuz','08':'Ağustos','09':'Eylül','10':'Ekim','11':'Kasım','12':'Aralık'};

function monthLabel(donem){ // 'YYYY-MM' -> 'Haziran 2026'
  if(!donem) return '';
  const [y,m] = donem.split('-');
  return `${MONTH_NAMES[m]||m} ${y}`;
}
function monthShort(donem){ // 'YYYY-MM' -> 'Haz'
  if(!donem) return '';
  return (MONTH_NAMES[donem.slice(5,7)]||'').slice(0,3);
}
function tl(n){
  if(n===null||n===undefined||n==='') return '—';
  return Number(n).toLocaleString('tr-TR',{maximumFractionDigits:0})+' ₺';
}
// Tutar giriş kutularından gelen metni Türkçe biçime göre sayıya çevirir.
// "30.000" -> 30000 (nokta binlik ayırıcı), "30.000,50" -> 30000.5 (virgül ondalık),
// "30,5" -> 30.5, "30.5" -> 30.5 (tek haneli/iki haneli nokta sonrası ondalık sayılır).
function parseTLInput(str){
  if(str===null||str===undefined) return null;
  str = String(str).trim().replace(/\s/g,'');
  if(str==='') return null;
  if(str.includes(',')){
    str = str.replace(/\./g,'').replace(',', '.');
  } else {
    const dotCount = (str.match(/\./g)||[]).length;
    if(dotCount>1){
      str = str.replace(/\./g,'');
    } else if(dotCount===1){
      const parts = str.split('.');
      if(parts[1] && parts[1].length===3){
        str = parts[0]+parts[1];
      }
    }
  }
  const n = Number(str);
  return isNaN(n) ? null : n;
}
function esc(s){ return (s===null||s===undefined) ? '' : String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function todayISO(){ const d=new Date(); return d.toISOString().slice(0,10); }
function nowMonth(){ const d=new Date(); return d.toISOString().slice(0,7); }

const STATE = {
  isletmeler: [],       // {id, ad, tip:'site'|'genel'} — Zeytinkule, ofisler, inşaatlar
  currentIsletmeId: null,
  apartments: [],
  payments: [],      // all rows from `payments`
  expenses: [],
  gelirler: [],       // 'genel' tipi işletmelerde serbest açıklamalı gelir kayıtları
  staff: [],
  staffPayments: [],
  maintenanceItems: [], // bakım kalemleri (asansör, yangın tüpü vb.)
  contracts: [],      // 'genel' tipi işletmelerde satılık/kiralık kontrat kayıtları
  contractInstallments: [], // taksitli kontratların taksit planı (kontrat_id ile bağlı)
  projeler: [],       // 'genel' tipi işletmelerde şirket içindeki inşaat/mimarlık projeleri
  projeView: null,    // Projeler sekmesinde liste mi (null) yoksa hangi projenin detayı açık ('genel' ya da proje id)
  months: [],         // sorted list of aidat donem values, e.g. ['2026-06','2026-07','2026-08']
  currentMonth: null,
  tab: 'ozet',
  search: '',
  chat: [],           // {role:'user'|'assistant', content:string}
  settings: {},       // key-value store: yasal checklist, genel kurul notu vb.
  settingsLoaded: false,
};

function currentIsletme(){
  return STATE.isletmeler.find(i=>i.id===STATE.currentIsletmeId) || null;
}
function isSiteTipi(){
  const i = currentIsletme();
  return !i || i.tip==='site';
}

/* ---------------------------- API HELPER ---------------------------- */
function authToken(){ return localStorage.getItem('zk_token'); }
async function api(path, opts={}){
  const res = await fetch(path, {
    method: opts.method || 'GET',
    headers: {
      'Content-Type': 'application/json',
      ...(authToken() ? {'Authorization': 'Bearer '+authToken()} : {}),
    },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  if(res.status===401){
    localStorage.removeItem('zk_token');
    showGate();
    throw new Error('Oturum sona erdi, tekrar giriş yapın');
  }
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error || ('İstek başarısız ('+res.status+')'));
  return data;
}

function paymentFor(no, tur, donem){
  return STATE.payments.find(p=>p.apartment_no===no && p.tur===tur && p.donem===donem);
}
function monthPayments(donem){
  return STATE.payments.filter(p=>p.tur==='aidat' && p.donem===donem);
}

/* ---------------------------- DAİRE DURUMU / CARİ HESAP ---------------------------- */
const DURUM_META = {
  ev_sahibi:      {label:'Ev Sahibi Oturuyor'},
  kiraci:         {label:'Kiracı Oturuyor'},
  bos_odeniyor:   {label:'Boş — Aidat Ödeniyor'},
  bos_muaf:       {label:'Boş — Aidattan Muaf'},
};
function durumLabel(a){
  if(!a) return '';
  const meta = DURUM_META[a.durum] || DURUM_META.ev_sahibi;
  if(a.durum==='kiraci' && a.kiraci_adi) return meta.label+' ('+a.kiraci_adi+')';
  return meta.label;
}
function isMuaf(a){ return a && a.durum==='bos_muaf'; }

// Bir dairenin "cari hesap" bakiyesi: demirbaş + (muaf değilse) tüm aylık aidatlar,
// standart aidat tutarına göre. Standart tutar Ayarlar'dan girilir (settings.standart_aidat_tutari).
function computeAptBalance(no){
  const a = STATE.apartments.find(x=>x.no===no);
  const standart = Number(STATE.settings.standart_aidat_tutari)||0;
  const muaf = isMuaf(a);
  let borc = 0, odenen = 0;
  const dem = paymentFor(no,'demirbas','tek');
  if(dem){ borc += Number(dem.tutar_beklenen)||0; odenen += Number(dem.tutar_odenen)||0; }
  if(!muaf){
    STATE.months.forEach(m=>{
      const r = paymentFor(no,'aidat',m);
      borc += standart;
      odenen += r ? (Number(r.tutar_odenen)||0) : 0;
    });
  }
  return {borc, odenen, kalan: borc-odenen, muaf};
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>t.classList.remove('show'), 2200);
}

/* ---------------------------- BOOT / AUTH ---------------------------- */
function showGate(){
  document.getElementById('app').classList.add('hide');
  document.getElementById('gate').classList.remove('hide');
}
function showApp(){
  document.getElementById('gate').classList.add('hide');
  document.getElementById('app').classList.remove('hide');
}

async function boot(){
  document.getElementById('loginForm').onsubmit = async (e)=>{
    e.preventDefault();
    const password = document.getElementById('loginPassword').value;
    const errEl = document.getElementById('loginErr');
    const btn = document.getElementById('loginBtn');
    errEl.textContent = ''; btn.disabled = true; btn.textContent = 'Giriş yapılıyor...';
    try{
      const res = await fetch('/api/login', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({password})});
      const data = await res.json();
      if(!res.ok) throw new Error(data.error || 'Giriş başarısız');
      localStorage.setItem('zk_token', data.token);
      await startApp();
    }catch(err){
      errEl.textContent = err.message;
    }finally{
      btn.disabled = false; btn.textContent = 'Giriş Yap';
    }
  };

  if(authToken()){
    try{ await startApp(); return; }
    catch(err){ localStorage.removeItem('zk_token'); }
  }
  showGate();
}

async function startApp(){
  showApp();
  document.getElementById('app').innerHTML = `<div class="center-pad"><div class="spinner"></div></div>`;
  await loadIsletmeler();
  await loadAll();
  await loadSettings();
  await loadChatHistory();
  render();
}

async function loadIsletmeler(){
  STATE.isletmeler = await api('/api/isletmeler');
  const saved = Number(localStorage.getItem('zk_isletme_id'));
  if(saved && STATE.isletmeler.some(i=>i.id===saved)) STATE.currentIsletmeId = saved;
  else STATE.currentIsletmeId = STATE.isletmeler[0]?.id || null;
}

// Asistan sohbet geçmişini veritabanından yükler — böylece sayfa yenilense/uygulama
// kapatılıp açılsa bile önceki konuşma kaybolmaz. İşletme değiştirilince de
// o işletmeye ait geçmiş ayrı ayrı yüklenir.
async function loadChatHistory(){
  if(!STATE.currentIsletmeId){ STATE.chat = []; return; }
  try{
    STATE.chat = await api('/api/chat/history?isletme_id='+STATE.currentIsletmeId);
  }catch(err){
    console.error('Sohbet geçmişi yüklenemedi:', err);
    STATE.chat = [];
  }
}

async function switchIsletme(id){
  STATE.currentIsletmeId = id;
  localStorage.setItem('zk_isletme_id', id);
  STATE.tab = 'ozet';
  STATE.currentMonth = null;
  STATE.projeView = null;
  STATE.settingsLoaded = false;
  document.getElementById('app').innerHTML = `<div class="center-pad"><div class="spinner"></div></div>`;
  await loadAll();
  await loadSettings();
  await loadChatHistory();
  render();
}

async function loadAll(){
  if(!STATE.currentIsletmeId) return;
  try{
    const data = await api('/api/data?isletme_id='+STATE.currentIsletmeId);
    STATE.apartments = data.apartments||[];
    STATE.payments = data.payments||[];
    STATE.expenses = data.expenses||[];
    STATE.gelirler = data.gelirler||[];
    STATE.staff = data.staff||[];
    STATE.staffPayments = data.staffPayments||[];
    STATE.maintenanceItems = data.maintenanceItems||[];
    STATE.contracts = data.contracts||[];
    STATE.contractInstallments = data.contractInstallments||[];
    STATE.projeler = data.projeler||[];
    STATE.months = [...new Set(STATE.payments.filter(x=>x.tur==='aidat').map(x=>x.donem))].sort();

    // Takvimde yeni bir ay başladıysa (ve daha önce en az bir ay oluşturulmuşsa),
    // o ayı tüm daireler için otomatik oluştur — elle "+ Yeni Ay Ekle" yapmaya gerek kalmasın.
    const curReal = nowMonth();
    if(isSiteTipi() && STATE.months.length && !STATE.months.includes(curReal)){
      try{
        const created = await api('/api/months', {method:'POST', body:{isletme_id:STATE.currentIsletmeId, donem:curReal}});
        STATE.payments.push(...created);
        STATE.months = [...new Set(STATE.payments.filter(x=>x.tur==='aidat').map(x=>x.donem))].sort();
        showToast(monthLabel(curReal)+' otomatik olarak oluşturuldu');
      }catch(e){ console.error('Otomatik ay oluşturma başarısız:', e); }
    }

    if(!STATE.currentMonth || !STATE.months.includes(STATE.currentMonth)){
      STATE.currentMonth = STATE.months[STATE.months.length-1] || null;
    }
  }catch(err){
    showToast('Bağlantı hatası: '+err.message);
    console.error(err);
    throw err;
  }
}

function logout(){
  localStorage.removeItem('zk_token');
  showGate();
}

/* ---------------------------- ROOT RENDER ---------------------------- */
function render(){
  const app = document.getElementById('app');
  app.innerHTML = `<div class="shell">${renderSidebar()}<main id="main"></main></div>`;
  renderMain();
}

function renderSidebar(){
  const monthOptions = STATE.months.map(m=>`<option value="${m}" ${m===STATE.currentMonth?'selected':''}>${monthLabel(m)}</option>`).join('');
  const i = currentIsletme();
  const ad = i?.ad || 'Yükleniyor...';
  const tabs = tabsFor();
  if(!tabs.some(t=>t.id===STATE.tab)) STATE.tab = 'ozet';
  const showMonthPill = isSiteTipi() && (STATE.tab==='ozet'||STATE.tab==='daireler') && STATE.months.length;
  return `
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="mark">N</div>
      <div class="name">Nizam</div>
    </div>
    <button class="isletme-pill" id="isletmeBtn" type="button">
      <span style="min-width:0;">
        <span style="opacity:.75;">İşletme</span>
        <b>${esc(ad)}</b>
      </span>
      <svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg>
    </button>
    ${showMonthPill ? `
    <div class="month-pill">
      ${ICON.calendar}
      <select id="monthSelect">${monthOptions}</select>
    </div>` : ''}
    <nav>
      ${tabs.map(t=>`
        <button data-tab="${t.id}" class="${STATE.tab===t.id?'active':''}" type="button">
          ${ICON[t.icon]}
          <span>${t.label}</span>
        </button>`).join('')}
    </nav>
    <div class="sidebar-foot">
      Yönetici
      <button id="logoutBtn" type="button">${ICON.logout} Çıkış Yap</button>
    </div>
  </aside>`;
}

function tabsFor(){
  if(isSiteTipi()){
    return [
      {id:'ozet', label:'Özet', icon:'home'},
      {id:'daireler', label:'Daireler', icon:'building'},
      {id:'asistan', label:'Asistan', icon:'chat'},
      {id:'giderler', label:'Giderler', icon:'receipt'},
      {id:'personel', label:'Personel', icon:'users'},
    ];
  }
  return [
    {id:'ozet', label:'Özet', icon:'home'},
    {id:'projeler', label:'İnşaat', icon:'proje'},
    {id:'gelir', label:'Gelir', icon:'box'},
    {id:'kontratlar', label:'Kontratlar', icon:'contract'},
    {id:'asistan', label:'Asistan', icon:'chat'},
    {id:'giderler', label:'Giderler', icon:'receipt'},
    {id:'personel', label:'Personel', icon:'users'},
  ];
}

const ADD_BTN_LABEL = {
  daireler: 'Yeni Ay Ekle',
  projeler: 'Yeni İnşaat',
  gelir: 'Yeni Gelir',
  kontratlar: 'Yeni Kontrat',
  giderler: 'Yeni Gider',
  personel: 'Yeni Personel',
};

function renderMain(){
  const main = document.getElementById('main');
  const tabs = tabsFor();
  const tabMeta = tabs.find(t=>t.id===STATE.tab) || tabs[0];
  const i = currentIsletme();
  const altYazi = i ? (i.tip==='site' ? 'Bina Yönetim Defteri' : 'İşletme Defteri') : '';
  const addLabel = (STATE.tab==='projeler' && STATE.projeView!==null) ? null : ADD_BTN_LABEL[STATE.tab];
  const header = `
    <div class="page-head">
      <div>
        <h1>${esc(tabMeta?.label||'')}</h1>
        <div class="sub">${esc(i?.ad||'')}${altYazi?' · '+altYazi:''}</div>
      </div>
      ${addLabel ? `<div class="actions"><button class="btn-toolbar gold" id="pageAddBtn" type="button">${ICON.plus} ${addLabel}</button></div>` : ''}
    </div>
  `;
  let body = '';
  if(STATE.tab==='ozet') body = renderOzet();
  else if(STATE.tab==='daireler') body = renderDaireler();
  else if(STATE.tab==='projeler') body = renderProjeler();
  else if(STATE.tab==='gelir') body = renderGelir();
  else if(STATE.tab==='kontratlar') body = renderKontratlar();
  else if(STATE.tab==='asistan') body = renderAsistan();
  else if(STATE.tab==='giderler') body = renderGiderler();
  else if(STATE.tab==='personel') body = renderPersonel();
  main.innerHTML = header + body;
  wireMain();
  if(STATE.tab==='asistan') wireAsistan();
  const addBtn = document.getElementById('pageAddBtn');
  if(addBtn) addBtn.onclick = onFab;
}

document.addEventListener('click', (e)=>{
  const tabBtn = e.target.closest('.sidebar nav button');
  if(tabBtn){ STATE.tab = tabBtn.dataset.tab; STATE.projeView = null; render(); return; }
  if(e.target.closest('#isletmeBtn')){ openIsletmeSecSheet(); return; }
  if(e.target.closest('#logoutBtn')){ logout(); return; }
});
document.addEventListener('change', (e)=>{
  if(e.target.id==='monthSelect'){ STATE.currentMonth = e.target.value; renderMain(); }
});

function onFab(){
  if(STATE.tab==='giderler') openExpenseSheet(null);
  else if(STATE.tab==='gelir') openGelirSheet(null);
  else if(STATE.tab==='kontratlar') openContractSheet(null);
  else if(STATE.tab==='projeler') openProjeSheet(null);
  else if(STATE.tab==='personel') openStaffSheet(null);
  else if(STATE.tab==='daireler') openAddMonthSheet();
  else STATE.tab='daireler', render();
}

/* ---------------------------- İŞLETME SEÇİCİ ---------------------------- */
function openIsletmeSecSheet(){
  const html = `
    <div class="sheet-head">
      <h2>İşletme Seç</h2>
      <button class="close" data-close-sheet>${ICON.x}</button>
    </div>
    <div class="row-list">
      ${STATE.isletmeler.map(i=>`
        <div class="apt-row" data-pick-isletme="${i.id}">
          <div class="apt-no" style="border-radius:11px;">${esc((i.ad||'?').slice(0,1).toUpperCase())}</div>
          <div class="apt-info">
            <div class="name">${esc(i.ad)}</div>
            <div class="kat">${i.tip==='site'?'Site / Bina':'Ofis veya İnşaat'}</div>
          </div>
          ${i.id===STATE.currentIsletmeId ? ICON.checkCircle : ''}
        </div>`).join('')}
    </div>
    <button class="btn btn-ghost btn-block" id="yeniIsletmeBtn" style="margin-top:14px;">${ICON.plus} Yeni İşletme Ekle</button>
    <button class="btn btn-ghost btn-block" id="yedekBtn" style="margin-top:10px;">${ICON.reportIcon} Tüm Veriyi Excel'e Yedekle</button>
    <button class="btn btn-danger btn-block" id="sheetLogoutBtn" style="margin-top:10px;">Çıkış Yap</button>
  `;
  openSheet(html);
  document.querySelectorAll('[data-pick-isletme]').forEach(el=>{
    el.onclick = async ()=>{
      const id = Number(el.dataset.pickIsletme);
      closeSheet();
      if(id!==STATE.currentIsletmeId) await switchIsletme(id);
    };
  });
  document.getElementById('yeniIsletmeBtn').onclick = openYeniIsletmeSheet;
  document.getElementById('yedekBtn').onclick = exportTumVeriYedek;
  document.getElementById('sheetLogoutBtn').onclick = logout;
}

async function exportTumVeriYedek(){
  if(typeof XLSX==='undefined'){ showToast('Excel modülü yüklenemedi, internet bağlantınızı kontrol edin'); return; }
  showToast('Yedek hazırlanıyor...');
  const wb = XLSX.utils.book_new();
  const usedNames = new Set();
  for(const isl of STATE.isletmeler){
    let data;
    try{ data = await api('/api/data?isletme_id='+isl.id); }
    catch(err){ continue; }
    const rows = [];
    rows.push([isl.ad + ' — ' + (isl.tip==='site' ? 'Site / Bina' : 'Ofis / İnşaat')]);
    rows.push(['Yedek tarihi', new Date().toLocaleDateString('tr-TR')]);
    rows.push([]);
    if(isl.tip==='site'){
      rows.push(['DAİRELER']);
      rows.push(['No','Malik','Durum','Kiracı Adı']);
      (data.apartments||[]).forEach(a=>rows.push([a.no, a.malik||'', a.durum||'', a.kiraci_adi||'']));
      rows.push([]);
      rows.push(['ÖDEMELER']);
      rows.push(['Daire No','Tür','Dönem','Tutar Ödenen','Durum']);
      (data.payments||[]).forEach(p=>rows.push([p.apartment_no, p.tur, p.donem, p.tutar_odenen, p.durum]));
    } else {
      rows.push(['GELİRLER']);
      rows.push(['Açıklama','Tutar','Tarih','Durum','Not']);
      (data.gelirler||[]).forEach(g=>rows.push([g.aciklama||'', g.tutar, g.tarih||'', g.durum||'', g.not_metni||'']));
    }
    rows.push([]);
    rows.push(['GİDERLER']);
    rows.push(['Ay','Gider Türü','Firma','Tutar','Tarih','Durum']);
    (data.expenses||[]).forEach(e=>rows.push([e.ay||'', e.gider_turu||'', e.firma||'', e.tutar, e.tarih||'', e.durum||'']));
    rows.push([]);
    rows.push(['PERSONEL']);
    rows.push(['İsim','Görev','Aylık Ücret']);
    (data.staff||[]).forEach(s=>rows.push([s.isim||'', s.gorev||'', s.aylik_ucret]));

    let sheetName = (isl.ad||('İşletme '+isl.id)).replace(/[\\/*?:\[\]]/g,'').slice(0,31) || ('Isletme'+isl.id);
    let n = 2;
    while(usedNames.has(sheetName)){ sheetName = sheetName.slice(0, 28)+'-'+n; n++; }
    usedNames.add(sheetName);
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), sheetName);
  }
  XLSX.writeFile(wb, 'tum-isletmeler-yedek-'+todayISO()+'.xlsx');
  showToast('Yedek indirildi');
}

function openYeniIsletmeSheet(){
  const html = `
    <div class="sheet-head">
      <h2>Yeni İşletme Ekle</h2>
      <button class="close" data-close-sheet>${ICON.x}</button>
    </div>
    <div class="field"><label>İsim</label><input id="ni_ad" placeholder="örn. Ofis 2, İnşaat A" /></div>
    <div class="field">
      <label>Tip</label>
      <div class="seg">
        <button type="button" data-tip="genel" class="on odendi">Ofis / İnşaat (Gelir-Gider)</button>
        <button type="button" data-tip="site" class="">Site / Bina (Daireler)</button>
      </div>
    </div>
    <button class="btn btn-primary btn-block" id="ni_kaydet">Oluştur</button>
  `;
  openSheet(html);
  let tip = 'genel';
  document.querySelectorAll('[data-tip]').forEach(b=>{
    b.onclick = ()=>{
      document.querySelectorAll('[data-tip]').forEach(x=>x.className='');
      tip = b.dataset.tip;
      b.className = 'on odendi';
    };
  });
  document.getElementById('ni_kaydet').onclick = async ()=>{
    const ad = document.getElementById('ni_ad').value.trim();
    if(!ad){ showToast('Bir isim yazın'); return; }
    try{
      const yeni = await api('/api/isletmeler', {method:'POST', body:{ad, tip}});
      STATE.isletmeler.push(yeni);
      closeSheet();
      await switchIsletme(yeni.id);
      showToast(ad+' eklendi');
    }catch(err){ showToast('Eklenemedi: '+err.message); }
  };
}

function dueMaintenanceItems(){
  const today = new Date();
  const limitDays = {aylik:31, '3ayda_bir':92, yillik:366};
  return STATE.maintenanceItems.filter(mi=>{
    if(!mi.son_yapilma_tarihi) return true;
    const gecen = (today - new Date(mi.son_yapilma_tarihi)) / (1000*60*60*24);
    return gecen >= (limitDays[mi.siklik] || 31);
  });
}

// Personel maaş takibi hangi aylar için gösterilsin: site tipinde aidat ayları,
// genel tipte (ofis/inşaat) aidat kavramı olmadığı için son 6 ay otomatik üretilir.
function staffMonthsFor(){
  if(isSiteTipi()) return STATE.months;
  const out = [];
  const d = new Date();
  for(let i=5;i>=0;i--){
    const dt = new Date(d.getFullYear(), d.getMonth()-i, 1);
    out.push(dt.toISOString().slice(0,7));
  }
  return out;
}

  };
}

    <div class="field"><label>Mülk Adı / Adresi</label><input id="k_mulk" value="${esc(k?.mulk_adi||'')}" placeholder="örn. Bahçelievler 3. Cadde No:12 Daire 4" /></div>
    ${STATE.projeler.length ? `<div class="field"><label>Hangi İnşaata Ait?</label><select id="k_proje">${projeSelectHtml(k?k.proje_id:presetProjeId)}</select></div>` : ''}
    <div class="field"><label>Tip</label>
      <div class="seg" data-role="tipSeg" style="flex-wrap:wrap;">
        <button type="button" data-tip="satilik" class="${(!k||k?.tip==='satilik')?'on odendi':''}">Satılık</button>
        <button type="button" data-tip="kiralik" class="${k?.tip==='kiralik'?'on odendi':''}">Kiralık</button>
        <button type="button" data-tip="taseron" class="${k?.tip==='taseron'?'on kismi':''}">Taşeron</button>
      </div>
      <div style="font-size:11px;color:var(--ink-dim);margin-top:6px;">Satılık/Kiralık → para içeri girer (Gelir). Taşeron → para dışarı çıkar (Gider).</div>
    </div>
    <div class="field"><label id="k_karsi_label">Karşı Taraf (Alıcı / Kiracı)</label><input id="k_karsi" value="${esc(k?.karsi_taraf||'')}" placeholder="örn. Ahmet Yılmaz" /></div>
    <div class="field"><label>Tutar (₺)</label><input id="k_tutar" type="text" inputmode="decimal" value="${k?.tutar??''}" /></div>
    ${k ? `
    <div class="field">
      <label>Taksitli Ödeme Planı (opsiyonel — peşinat + taksitler)</label>
      <div id="k_taksit_liste"></div>
      <div style="display:flex;gap:8px;margin-top:8px;">
        <input id="k_taksit_tarih_yeni" type="date" style="flex:1;" />
        <input id="k_taksit_tutar_yeni" type="text" inputmode="decimal" placeholder="Tutar" style="flex:1;" />
        <button type="button" class="btn btn-ghost" id="k_taksit_ekle_btn">${ICON.plus}</button>
      </div>
      <button type="button" class="btn btn-ghost btn-block" id="k_taksit_kaydet_btn" style="margin-top:8px;">Taksit Planını Kaydet</button>
      <div style="font-size:11px;color:var(--ink-dim);margin-top:6px;">Taksit eklersen yukarıdaki Tutar, taksitlerin toplamından otomatik hesaplanır. Her taksit Gelir/Gider'de ayrı bir satır olur, ödendiğinde oradan işaretlersin. Bir taksidi buradan kaldırırsan, ona bağlı gelir/gider kaydı da silinir.</div>
    </div>
    ` : `<p style="font-size:11.5px;color:var(--ink-dim);margin:-8px 0 6px;line-height:1.5;">Taksitli ödeme planı eklemek için önce kontratı bir kere kaydet, sonra tekrar aç.</p>`}
    <div class="field"><label>Başlangıç Tarihi</label><input id="k_baslangic" type="date" value="${k?.baslangic_tarihi||''}" /></div>
    <div class="field"><label>Bitiş Tarihi (varsa)</label><input id="k_bitis" type="date" value="${k?.bitis_tarihi||''}" /></div>
    <div class="field"><label>Durum</label>
      <div class="seg">
        <button type="button" data-durum="aktif" class="${(!k||k?.durum==='aktif')?'on odendi':''}">Aktif</button>
        <button type="button" data-durum="tamamlandi" class="${k?.durum==='tamamlandi'?'on odenmedi':''}">Tamamlandı</button>
        <button type="button" data-durum="gelecek" class="${k?.durum==='gelecek'?'on kismi':''}">Gelecek</button>
      </div>
    </div>
    <div class="field"><label>Not</label><textarea id="k_not">${esc(k?.not_metni||'')}</textarea></div>
    <p id="k_yon_not" style="font-size:11px;color:var(--ink-dim);margin:-8px 0 10px;line-height:1.5;"></p>
    <label style="display:flex;align-items:flex-start;gap:9px;margin:0 0 16px;cursor:pointer;font-size:12.5px;color:var(--ink-dim);line-height:1.4;">
      <input type="checkbox" id="k_gelir_olustur" ${(!k || k?.gelir_olustur!==false) ? 'checked' : ''} style="margin-top:2px;flex:none;width:16px;height:16px;" />
      <span id="k_yon_checkbox_label"></span>
    </label>
    <div class="field">
      <label>Belge (sözleşme, PDF veya fotoğraf)</label>
      ${k?.has_belge ? `
        <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px;" id="k_belge_row">
          <button type="button" class="btn btn-ghost" id="k_view_belge" style="flex:1;">${ICON.paperclip} ${esc(k.belge_ad||'Belgeyi Görüntüle')}</button>
          <button type="button" class="btn btn-danger" id="k_remove_belge">${ICON.x}</button>
        </div>` : ''}
      <input id="k_belge_input" type="file" accept=".pdf,.jpg,.jpeg,.png" />
      <div style="font-size:11px;color:var(--ink-dim);margin-top:6px;">${k?.has_belge?'Yeni bir dosya seçersen mevcut belgenin yerini alır.':'PDF veya fotoğraf yükleyebilirsin (en fazla ~8 MB).'}</div>
    </div>
    <div style="display:flex;gap:9px;">
      ${k?`<button class="btn btn-danger" id="delKontratBtn">${ICON.trash}</button>`:''}
      <button class="btn btn-primary btn-block" id="saveKontratBtn">Kaydet</button>
    </div>
  `;
  openSheet(html);
  let tip = k?.tip || 'satilik';
  function updateYonUI(){
    const yon = kontratYonlu(tip);
    document.getElementById('k_karsi_label').textContent = yon==='gider' ? 'Karşı Taraf (Taşeron / Firma)' : 'Karşı Taraf (Alıcı / Kiracı)';
    document.getElementById('k_yon_not').textContent = yon==='gider'
      ? 'Bu kontratı kaydettiğinde, aynı tutarda Gider tarafında da otomatik bir kayıt oluşur (veya güncellenir). Kontratı silersen, o gider kaydı da otomatik silinir.'
      : 'Bu kontratı kaydettiğinde, aynı tutarda Gelir tarafında da otomatik bir kayıt oluşur (veya güncellenir). Kontratı silersen, o gelir kaydı da otomatik silinir.';
    document.getElementById('k_yon_checkbox_label').innerHTML = yon==='gider'
      ? 'Bu kontrat geçmişe ait, gideri zaten Gider sayfasına elle girdim — <b>otomatik gider kaydı oluşturma</b>.'
      : 'Bu kontrat geçmişe ait, geliri zaten Gelir sayfasına elle girdim — <b>otomatik gelir kaydı oluşturma</b>.';
  }
  const tipSeg = document.querySelector('[data-role="tipSeg"]');
  tipSeg.querySelectorAll('[data-tip]').forEach(b=>{
    b.onclick = ()=>{
      tipSeg.querySelectorAll('[data-tip]').forEach(x=>x.className='');
      tip = b.dataset.tip;
      b.className = 'on ' + (kontratYonlu(tip)==='gider' ? 'kismi' : 'odendi');
      updateYonUI();
    };
  });
  updateYonUI();

  let taksitPlan = k ? taksitlerForKontrat(k.id).map(t=>({id:t.id, tarih:t.vade_tarihi, tutar:t.tutar})) : [];
  const taksitListeEl = document.getElementById('k_taksit_liste');
  const kTutarInput = document.getElementById('k_tutar');
  function renderTaksitListe(){
    if(!taksitListeEl) return;
    if(!taksitPlan.length){
      taksitListeEl.innerHTML = '<p style="font-size:12px;color:var(--ink-dim);">Henüz taksit eklenmedi — kontrat peşin/tek ödeme kabul edilir.</p>';
      kTutarInput.disabled = false;
      return;
    }
    taksitListeEl.innerHTML = taksitPlan.map((t,i)=>{
      const kayit = t.id ? kayitForTaksit(t.id, kontratYonlu(tip)==='gelir') : null;
      const durumEtiket = kayit ? statusChip(kayit.durum) : '<span class="chip kismi">Kaydedilecek</span>';
      return `<div style="display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap;">
        <span style="font-size:12px;color:var(--ink-dim);width:16px;">${i+1}.</span>
        <input type="date" data-taksit-tarih="${i}" value="${t.tarih||''}" style="flex:1;min-width:120px;" />
        <input type="text" inputmode="decimal" data-taksit-tutar="${i}" value="${t.tutar??''}" placeholder="Tutar" style="flex:1;min-width:90px;" />
        ${durumEtiket}
        <button type="button" class="btn btn-danger" data-taksit-sil="${i}" style="padding:6px 10px;">${ICON.x}</button>
      </div>`;
    }).join('');
    kTutarInput.value = taksitPlan.reduce((s,t)=>s+(Number(t.tutar)||0),0);
    kTutarInput.disabled = true;
    taksitListeEl.querySelectorAll('[data-taksit-tarih]').forEach(inp=>{
      inp.onchange = ()=>{ taksitPlan[Number(inp.dataset.taksitTarih)].tarih = inp.value; };
    });
    taksitListeEl.querySelectorAll('[data-taksit-tutar]').forEach(inp=>{
      inp.oninput = ()=>{ taksitPlan[Number(inp.dataset.taksitTutar)].tutar = parseTLInput(inp.value); kTutarInput.value = taksitPlan.reduce((s,t)=>s+(Number(t.tutar)||0),0); };
    });
    taksitListeEl.querySelectorAll('[data-taksit-sil]').forEach(btn=>{
      btn.onclick = ()=>{ taksitPlan.splice(Number(btn.dataset.taksitSil),1); renderTaksitListe(); };
    });
  }
  renderTaksitListe();
  const taksitEkleBtn = document.getElementById('k_taksit_ekle_btn');
  if(taksitEkleBtn) taksitEkleBtn.onclick = ()=>{
    const tarih = document.getElementById('k_taksit_tarih_yeni').value;
    const tutar = parseTLInput(document.getElementById('k_taksit_tutar_yeni').value);
    if(!tarih || !tutar){ showToast('Taksit için tarih ve tutar gerekli'); return; }
    taksitPlan.push({id:null, tarih, tutar});
    document.getElementById('k_taksit_tarih_yeni').value = '';
    document.getElementById('k_taksit_tutar_yeni').value = '';
    renderTaksitListe();
  };
  const taksitKaydetBtn = document.getElementById('k_taksit_kaydet_btn');
  if(taksitKaydetBtn) taksitKaydetBtn.onclick = async ()=>{
    taksitKaydetBtn.disabled = true; taksitKaydetBtn.textContent = 'Kaydediliyor...';
    try{
      await api('/api/contracts/'+k.id+'/taksitler', {method:'PUT', body:{taksitler: taksitPlan.map(t=>({id:t.id, tarih:t.tarih, tutar:t.tutar}))}});
      await loadAll();
      showToast('Taksit planı kaydedildi');
      openContractSheet(k.id);
    }catch(err){ showToast('Taksit planı kaydedilemedi: '+err.message); taksitKaydetBtn.disabled=false; taksitKaydetBtn.textContent='Taksit Planını Kaydet'; }
  };

  let durum = k?.durum || 'aktif';
  document.querySelectorAll('[data-durum]').forEach(b=>{
    b.onclick = ()=>{
      document.querySelectorAll('[data-durum]').forEach(x=>x.className='');
      durum = b.dataset.durum;
      const cls = durum==='aktif' ? 'odendi' : (durum==='tamamlandi' ? 'odenmedi' : 'kismi');
      b.className = 'on '+cls;
    };
  });
  let removeBelge = false;
  const viewBtn = document.getElementById('k_view_belge');
  if(viewBtn) viewBtn.onclick = ()=> openContractBelge(k.id);
  const removeBtn = document.getElementById('k_remove_belge');
  if(removeBtn) removeBtn.onclick = ()=>{
    removeBelge = true;
    showToast('Kaydettiğinde belge kaldırılacak');
    document.getElementById('k_belge_row').style.opacity = '0.4';
  };

  document.getElementById('saveKontratBtn').onclick = async ()=>{
    const fileInput = document.getElementById('k_belge_input');
    const file = fileInput.files[0];
    if(file && file.size > 8*1024*1024){ showToast('Dosya çok büyük (en fazla 8 MB)'); return; }
    const projeSel = document.getElementById('k_proje');
    const payload = {
      isletme_id: STATE.currentIsletmeId,
      mulk_adi: document.getElementById('k_mulk').value || null,
      tip,
      karsi_taraf: document.getElementById('k_karsi').value || null,
      tutar: parseTLInput(document.getElementById('k_tutar').value),
      baslangic_tarihi: document.getElementById('k_baslangic').value || null,
      bitis_tarihi: document.getElementById('k_bitis').value || null,
      durum,
      not_metni: document.getElementById('k_not').value || null,
      remove_belge: removeBelge,
      proje_id: projeSel && projeSel.value ? Number(projeSel.value) : null,
      gelir_olustur: document.getElementById('k_gelir_olustur').checked,
    };
    const saveBtnEl = document.getElementById('saveKontratBtn');
    saveBtnEl.disabled = true; saveBtnEl.textContent = 'Kaydediliyor...';
    try{
      if(file){
        const dataUrl = await new Promise((resolve,reject)=>{
          const reader = new FileReader();
          reader.onload = ()=>resolve(reader.result);
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
        const base64 = dataUrl.split(',')[1];
        payload.belge_ad = file.name;
        payload.belge_tip = file.type || 'application/octet-stream';
        payload.belge_data = base64;
      }
      if(k) await api('/api/contracts/'+k.id, {method:'PUT', body:payload});
      else await api('/api/contracts', {method:'POST', body:payload});
      // Kontrat kaydı, bağlı Gelir kaydını da sunucu tarafında otomatik oluşturur/günceller —
      // Gelir, Özet ve raporlarda hemen doğru görünsün diye tüm veriyi tazeliyoruz.
      await loadAll();
      closeSheet(); showToast('Kaydedildi'); renderMain();
    }catch(err){ showToast('Kaydedilemedi: '+err.message); console.error(err); }
    finally{ saveBtnEl.disabled=false; saveBtnEl.textContent='Kaydet'; }
  };
  const del = document.getElementById('delKontratBtn');
  if(del) del.onclick = async ()=>{
    try{
      await api('/api/contracts/'+k.id, {method:'DELETE'});
      // Kontrata bağlı otomatik Gelir kaydı sunucuda da silinir; veriyi tazele.
      await loadAll();
      closeSheet(); showToast('Silindi'); renderMain();
    }catch(err){ showToast('Silinemedi: '+err.message); }
  };
}

/* ---------------------------- PROJELER TAB (ofis/inşaat — şirket içindeki inşaat/mimarlık projeleri) ---------------------------- */
const PROJE_DURUM_META = {
  aktif:      {chip:'odendi',   label:'Aktif'},
  tamamlandi: {chip:'odenmedi', label:'Tamamlandı'},
  beklemede:  {chip:'kismi',    label:'Beklemede'},
};
function projeDurumChip(durum){
  const meta = PROJE_DURUM_META[durum] || PROJE_DURUM_META.aktif;
  return `<span class="chip ${meta.chip}">${meta.label}</span>`;
}

// pid: 'genel' -> proje_id boş olan (Ofis Geneli) kayıtlar; sayı -> o projeye ait kayıtlar
function kayitlarForProje(pid){
  const match = (proje_id)=> pid==='genel' ? !proje_id : proje_id===pid;
  return {
    gelirler: STATE.gelirler.filter(g=>match(g.proje_id)),
    expenses: STATE.expenses.filter(e=>match(e.proje_id)),
    contracts: STATE.contracts.filter(k=>match(k.proje_id)),
    staff: STATE.staff.filter(p=>match(p.proje_id)),
  };
}
function projeOzetSayilari(pid){
  const {gelirler, expenses} = kayitlarForProje(pid);
  const gelir = gelirler.filter(g=>g.durum==='ÖDENDİ').reduce((s,g)=>s+(Number(g.tutar)||0),0);
  const gider = expenses.filter(e=>e.durum==='ÖDENDİ').reduce((s,e)=>s+(Number(e.tutar)||0),0);
  return {gelir, gider, net: gelir-gider};
}

function renderProjeler(){
  if(STATE.projeView===null || STATE.projeView===undefined) return renderProjelerListesi();
  return renderProjeDetay(STATE.projeView);
}

function renderProjelerListesi(){
  const rows = STATE.projeler.map(p=>({p, ozet:projeOzetSayilari(p.id)}));
  const toplamGelir = rows.reduce((s,r)=>s+r.ozet.gelir,0);
  const toplamGider = rows.reduce((s,r)=>s+r.ozet.gider,0);
  return `
    <div class="kpis">
      <div class="kpi"><div class="lbl">Toplam İnşaat</div><div class="val">${STATE.projeler.length}</div></div>
      <div class="kpi good"><div class="lbl">Aktif İnşaat</div><div class="val">${STATE.projeler.filter(p=>p.durum==='aktif').length}</div></div>
      <div class="kpi ${(toplamGelir-toplamGider)>=0?'good':'bad'}"><div class="lbl">İnşaat Toplam Net</div><div class="val">${tl(toplamGelir-toplamGider)}</div></div>
    </div>
    <p style="font-size:11px;color:var(--ink-dim);margin:-6px 0 14px;">Bu sayfada sadece inşaat dosyaları listelenir; ofis geneline ait kayıtlar için Özet sayfasındaki "Ofis Geneli" bağlantısını kullanın.</p>

    <div class="section-title">İnşaat Dosyaları</div>
    ${!STATE.projeler.length ? `<div class="empty">${ICON.proje}<div><b>Henüz inşaat dosyası eklenmedi</b><br>Üstteki "Yeni İnşaat" ile ilk inşaat dosyanızı ekleyin.</div></div>` : `
    <div class="row-list">
      ${rows.map(({p,ozet})=>`
        <div class="apt-row" data-open-proje="${p.id}">
          <div class="apt-no" style="border-radius:11px;">${ICON.proje}</div>
          <div class="apt-info">
            <div class="name">${esc(p.ad)}</div>
            <div class="kat">${PROJE_DURUM_META[p.durum]?.label||'Aktif'}${p.aciklama?' · '+esc(p.aciklama):''}</div>
          </div>
          <div class="apt-amount" style="text-align:right;">
            <div style="font-weight:700;color:${ozet.net>=0?'var(--success)':'var(--danger)'};">${tl(ozet.net)}</div>
            <div style="font-size:10.5px;">net</div>
          </div>
          ${ICON.chevron}
        </div>`).join('')}
    </div>`}
  `;
}

// İnşaat/Ofis Geneli detay sayfasında Gelirler ve Giderler listelerini, Gelir/Giderler
// sekmelerindeki gibi aya göre gruplanmış, açılır/kapanır kutular halinde gösterir.
function projeGelirGruplu(rows){
  if(!rows.length) return `<p style="color:var(--ink-dim);font-size:13px;">Kayıt yok.</p>`;
  const groups = {};
  rows.forEach(g=>{
    const key = g.tarih ? g.tarih.slice(0,7) : '__none__';
    (groups[key] = groups[key] || []).push(g);
  });
  const groupKeys = Object.keys(groups).sort((a,b)=>{
    if(a==='__none__') return 1;
    if(b==='__none__') return -1;
    return b.localeCompare(a); // en yeni ay en üstte
  });
  return `<div style="margin-bottom:8px;">${groupKeys.map((key,idx)=>{
    const grupRows = groups[key];
    const grupToplam = grupRows.filter(g=>g.durum==='ÖDENDİ').reduce((s,g)=>s+(Number(g.tutar)||0),0);
    const label = key==='__none__' ? 'Tarih Belirtilmemiş' : monthLabel(key);
    return `
    <details class="table-card ay-group" style="margin-bottom:8px;" ${idx===0?'open':''}>
      <summary class="table-card-head">
        <h2>${esc(label)}</h2>
        <div style="display:flex;align-items:center;gap:14px;">
          <span style="font-size:11.5px;color:var(--ink-dim);">${grupRows.length} kayıt</span>
          <span class="mono" style="font-weight:700;">${tl(grupToplam)}</span>
          <span class="ay-group-chevron">${ICON.chevron}</span>
        </div>
      </summary>
      <div class="table-scroll">
        <table class="table-pro">
          <thead><tr><th>Açıklama</th><th>Kişi/Taraf</th><th>Tarih</th><th class="num">Tutar</th><th>Durum</th></tr></thead>
          <tbody>
            ${grupRows.map(g=>`
              <tr data-open-gelir="${g.id}">
                <td class="name-cell">${esc(g.aciklama||'—')}${g.kontrat_id?` <span class="chip" style="background:var(--brand-soft);color:var(--brand);">Kontrat</span>`:''}</td>
                <td>${esc(g.taraf||'—')}</td>
                <td>${g.tarih? new Date(g.tarih).toLocaleDateString('tr-TR'):'—'}</td>
                <td class="num">${tl(g.tutar)}</td>
                <td>${statusChip(g.durum)}</td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </details>`;
  }).join('')}</div>`;
}

function projeGiderGruplu(rows){
  if(!rows.length) return `<p style="color:var(--ink-dim);font-size:13px;">Kayıt yok.</p>`;
  const groups = {};
  rows.forEach(e=>{
    const key = e.ay || 'Ay Belirtilmemiş';
    (groups[key] = groups[key] || []).push(e);
  });
  const groupKeys = Object.keys(groups).sort((a,b)=>{
    const maxTime = (list)=> Math.max(0, ...list.map(e=> e.tarih ? new Date(e.tarih).getTime() : 0));
    return maxTime(groups[b]) - maxTime(groups[a]);
  });
  return `<div style="margin-bottom:8px;">${groupKeys.map((key,idx)=>{
    const grupRows = groups[key];
    const grupToplam = grupRows.filter(e=>e.durum==='ÖDENDİ').reduce((s,e)=>s+(Number(e.tutar)||0),0);
    return `
    <details class="table-card ay-group" style="margin-bottom:8px;" ${idx===0?'open':''}>
      <summary class="table-card-head">
        <h2>${esc(key)}</h2>
        <div style="display:flex;align-items:center;gap:14px;">
          <span style="font-size:11.5px;color:var(--ink-dim);">${grupRows.length} kayıt</span>
          <span class="mono" style="font-weight:700;">${tl(grupToplam)}</span>
          <span class="ay-group-chevron">${ICON.chevron}</span>
        </div>
      </summary>
      <div class="table-scroll">
        <table class="table-pro">
          <thead><tr><th>Gider Türü</th><th>Firma / Kişi</th><th>Tarih</th><th class="num">Tutar</th><th>Durum</th></tr></thead>
          <tbody>
            ${grupRows.map(e=>`
              <tr data-open-exp="${e.id}">
                <td class="name-cell">${esc(e.gider_turu||'—')}${e.kontrat_id?` <span class="chip" style="background:var(--brand-soft);color:var(--brand);">Kontrat</span>`:''}</td>
                <td>${esc(e.firma||e.taraf||'—')}</td>
                <td>${e.tarih? new Date(e.tarih).toLocaleDateString('tr-TR'):'—'}</td>

function wireAsistan(){
  const log = document.getElementById('chatLog');
  if(log) log.scrollTop = log.scrollHeight;
  const input = document.getElementById('chatInput');
  const send = document.getElementById('chatSendBtn');
  const go = ()=> sendChat(input.value);
  send.onclick = go;
  input.onkeydown = (e)=>{ if(e.key==='Enter') go(); };
  document.querySelectorAll('[data-suggest]').forEach(b=>{
    b.onclick = ()=> sendChat(b.dataset.suggest);
  });

async function sendChat(text){
  text = (text||'').trim();
  if(!text) return;
  // created_at burada da tutuluyor ki asistan "hangi tarihte ne konuşmuştuk" gibi sorularda
  // sunucuya gönderilen geçmişten mesajın gerçek zamanını görebilsin (bkz. server.js /api/chat).
  STATE.chat.push({role:'user', content:text, created_at:new Date().toISOString()});
  renderMain();
  const log = document.getElementById('chatLog');
  const loadingEl = document.createElement('div');
  loadingEl.className = 'msg bot loading';
  loadingEl.textContent = 'Yazıyor...';
  log.appendChild(loadingEl);
  log.scrollTop = log.scrollHeight;
  try{
    // Modele gönderilen geçmiş, çok uzun süren tek bir oturumda bile makul boyutta
    // kalsın diye son 40 mesajla sınırlandırılır (veritabanındaki tam geçmiş korunur).
    const history = STATE.chat.slice(0,-1).slice(-40).map(m=>({role:m.role, content:m.content, created_at:m.created_at}));
    const data = await api('/api/chat', {method:'POST', body:{message:text, history, isletme_id:STATE.currentIsletmeId}});
    STATE.chat.push({role:'assistant', content:data.response, created_at:new Date().toISOString()});
    if(data.changed){
      await loadAll();
    }
  }catch(err){
    STATE.chat.push({role:'assistant', content:'Bir hata oldu: '+err.message, created_at:new Date().toISOString()});
  }
  renderMain();
}

/* ---------------------------- SHEET (bottom modal) SYSTEM ---------------------------- */
function openSheet(innerHtml){
  closeSheet();
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.id = 'overlay';
  ov.innerHTML = `<div class="sheet"><div class="sheet-handle"></div>${innerHtml}</div>`;
  ov.onclick = (e)=>{ if(e.target===ov) closeSheet(); };
  document.body.appendChild(ov);
  requestAnimationFrame(()=> ov.classList.add('open'));
  document.body.style.overflow = 'hidden';
}
function closeSheet(){
  const ov = document.getElementById('overlay');
  if(ov){ ov.remove(); }
  document.body.style.overflow = '';
}
document.addEventListener('click', (e)=>{
  if(e.target.closest('[data-close-sheet]')) closeSheet();
});

function periodRowsForApartment(no){
  const rows = [];
  const dem = paymentFor(no,'demirbas','tek');
  rows.push({key:'demirbas|tek', tur:'demirbas', donem:'tek', label:'Demirbaş', row: dem});
  STATE.months.forEach(m=>{
    rows.push({key:'aidat|'+m, tur:'aidat', donem:m, label:monthLabel(m)+' Aidatı', row: paymentFor(no,'aidat',m)});

  return rows;
}

function wireDurumBlock(no, a){
  const seg = document.querySelector('[data-role="durumSeg"]');
  let pendingDurum = a.durum || 'ev_sahibi';
  const kiraciField = document.getElementById('kiraciAdiField');
  seg.querySelectorAll('button').forEach(btn=>{
    btn.onclick = ()=>{
      seg.querySelectorAll('button').forEach(b=>b.className='');
      btn.className = 'on odendi';
      pendingDurum = btn.dataset.durum;
      kiraciField.style.display = pendingDurum==='kiraci' ? '' : 'none';
    };
  });
  document.getElementById('saveDurumBtn').onclick = async ()=>{
    const payload = { durum: pendingDurum, kiraci_adi: pendingDurum==='kiraci' ? (document.getElementById('kiraciAdiInput').value||null) : null };
    try{
      const data = await api('/api/apartments/'+no+'?isletme_id='+STATE.currentIsletmeId, {method:'PUT', body:payload});
      const idx = STATE.apartments.findIndex(x=>x.no===no);
      if(idx>=0) STATE.apartments[idx] = data;
      showToast('Kaydedildi');
      openApartmentSheet(no);
      renderMain();
    }catch(err){ showToast('Kaydedilemedi: '+err.message); }

}

function periodEditBlock(no, r){
  const row = r.row;
  const durum = row ? row.durum : 'ÖDENMEDİ';
  const tutar = row ? row.tutar_odenen : '';
  const not_ = row ? (row.not_metni||'') : '';
  const statuses = r.tur==='aidat'
    ? ['ÖDENMEDİ','ÖDENDİ','KISMİ ÖDENDİ','VERMİYOR']
    : ['ÖDENMEDİ','ÖDENDİ','KISMİ ÖDENDİ'];
  const meta = STATUS_META;
  return `
  <div class="card" style="padding:14px;" data-period="${r.key}">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
      <b style="font-size:13.5px;">${r.label}</b>
      ${row && row.kaynak && row.kaynak!=='-' && row.kaynak!=='Dijital kayıt' ? `<span style="font-size:10.5px;color:var(--warning);font-weight:700;">${esc(row.kaynak)}</span>`:''}
    </div>
    <div class="seg" data-role="statusSeg">
      ${statuses.map(s=>`<button type="button" data-status="${s}" class="${s===durum?'on '+meta[s].chip:''}">${meta[s].label}</button>`).join('')}
    </div>
    <div style="display:flex;gap:8px;margin-top:10px;">
      <input type="text" inputmode="decimal" data-role="tutar" placeholder="Tutar (₺)" value="${tutar!==null&&tutar!==undefined?tutar:''}" style="flex:1;border:1px solid var(--line);background:var(--surface-2);border-radius:11px;padding:10px 11px;font:inherit;color:var(--ink);" />
      <button type="button" class="btn btn-primary" data-role="save" style="flex:none;">Kaydet</button>
    </div>
    ${row && row.not_metni ? `<div style="font-size:11.5px;color:var(--ink-dim);margin-top:8px;">${esc(row.not_metni)}</div>`:''}
  </div>`;
}

function wirePeriodBlocks(no){
  document.querySelectorAll('[data-period]').forEach(block=>{
    const seg = block.querySelector('[data-role="statusSeg"]');
    seg.querySelectorAll('button').forEach(btn=>{
      btn.onclick = ()=>{
        seg.querySelectorAll('button').forEach(b=>{ b.className=''; });
        const s = btn.dataset.status;
        btn.className = 'on ' + STATUS_META[s].chip;
        block.dataset.pendingStatus = s;
      };
    });
    block.querySelector('[data-role="save"]').onclick = async ()=>{
      const [tur,donem] = block.dataset.period.split('|');
      const status = block.dataset.pendingStatus || seg.querySelector('button.on')?.dataset.status || 'ÖDENMEDİ';
      const tutarVal = block.querySelector('[data-role="tutar"]').value;
      await savePayment(no, tur, donem, status, parseTLInput(tutarVal));
    };
  });
}

async function savePayment(no, tur, donem, durum, tutar){
  try{
    const data = await api('/api/payments/upsert', {method:'POST', body:{isletme_id:STATE.currentIsletmeId, apartment_no:no, tur, donem, tutar_odenen:tutar, durum}});
    const idx = STATE.payments.findIndex(p=>p.apartment_no===no && p.tur===tur && p.donem===donem);
    if(idx>=0) STATE.payments[idx] = data; else STATE.payments.push(data);
    showToast('Kaydedildi');
    renderMain();
  }catch(err){ showToast('Kaydedilemedi: '+err.message); console.error(err); }
}

/* ---------------------------- GİDER SHEET ---------------------------- */
function firmaToplam(firma){
  return STATE.expenses.filter(x=>x.firma===firma && x.durum==='ÖDENDİ').reduce((s,x)=>s+(Number(x.tutar)||0),0);
}

// Gelir ve giderlerde bugüne kadar kullanılmış tüm kişi/taraf isimleri (hızlı seçim için)
function tarafListesi(){
  const set = new Set();
  STATE.gelirler.forEach(g=>{ if(g.taraf) set.add(g.taraf); });
  STATE.expenses.forEach(e=>{ if(e.taraf) set.add(e.taraf); });
  return [...set].sort((a,b)=>a.localeCompare(b,'tr'));
}
// Bir kişi/tarafa bugüne kadar giden (gider) ve o kişiden gelen (gelir) toplamları
function tarafOzet(taraf){
  const gRows = STATE.gelirler.filter(g=>g.taraf===taraf);
  const eRows = STATE.expenses.filter(e=>e.taraf===taraf);
  const gelirToplam = gRows.filter(g=>g.durum==='ÖDENDİ').reduce((s,g)=>s+(Number(g.tutar)||0),0);
  const giderToplam = eRows.filter(e=>e.durum==='ÖDENDİ').reduce((s,e)=>s+(Number(e.tutar)||0),0);
  return {gRows, eRows, gelirToplam, giderToplam};
}
// Aynı taraf/cari hesap özetleri, ama tek bir projenin (inşaat dosyasının) kayıtlarıyla sınırlı —
// her proje kendi içinde ayrı bir hesap defteri gibi çalışsın diye.
function tarafListesiForProje(pid){
  const {gelirler, expenses} = kayitlarForProje(pid);
  const set = new Set();
  gelirler.forEach(g=>{ if(g.taraf) set.add(g.taraf); });
  expenses.forEach(e=>{ if(e.taraf) set.add(e.taraf); });
  return [...set].sort((a,b)=>a.localeCompare(b,'tr'));
}
function tarafOzetForProje(taraf, pid){
  const {gelirler, expenses} = kayitlarForProje(pid);
  const gRows = gelirler.filter(g=>g.taraf===taraf);
  const eRows = expenses.filter(e=>e.taraf===taraf);
  const gelirToplam = gRows.filter(g=>g.durum==='ÖDENDİ').reduce((s,g)=>s+(Number(g.tutar)||0),0);
  const giderToplam = eRows.filter(e=>e.durum==='ÖDENDİ').reduce((s,e)=>s+(Number(e.tutar)||0),0);
  return {gRows, eRows, gelirToplam, giderToplam};
}
// Bir projenin (inşaat dosyasının) kendi Cari Hesap Ekstresi — firma ya da kişi bazında,

function openProjeCariEkstreSheet(pid){
  const proje = STATE.projeler.find(p=>p.id===pid);

  const firmalar = [...new Set(expenses.map(e=>e.firma).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'tr'));

    <div class="field"><label>Ne bazında bakmak istersin?</label>

    </div>

      <select id="p_ekstre_kisi">

        ${kisiler.map(k=>`<option value="${esc(k)}">${esc(k)}</option>`).join('')}
      </select>
    </div>
    <div id="p_ekstre_result"></div>
  `;

  document.getElementById('pEkstreBack').onclick = ()=> closeSheet();
  const modSeg = document.querySelector('[data-role="pEkstreModSeg"]');
  modSeg.querySelectorAll('[data-mod]').forEach(b=>{

    const toplam = rows.filter(r=>r.durum==='ÖDENDİ').reduce((s,r)=>s+(Number(r.tutar)||0),0);
    const bekleyen = rows.filter(r=>r.durum!=='ÖDENDİ').reduce((s,r)=>s+(Number(r.tutar)||0),0);
    result.innerHTML = `
      <div id="printArea">
        <h3 style="margin-bottom:2px;">${esc(proje?.ad||'')} — Cari Hesap Ekstresi</h3>

          ${rows.map(r=>`<tr><td>${r.tarih||'—'}</td><td>${esc(r.gider_turu||'')}</td><td>${esc(r.durum||'')}</td><td class="mono">${tl(r.tutar)}</td></tr>`).join('') || '<tr><td colspan="4">Kayıt yok</td></tr>'}

    if(!kisi){ result.innerHTML=''; return; }

    ].sort((a,b)=>(a.tarih||'').localeCompare(b.tarih||''));
